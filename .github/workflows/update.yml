name: Update tracker
on:
  schedule:
    - cron: "0 6 * * *"   # once a day
  workflow_dispatch:       # "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Update tracker data" || echo "no changes"
          git push
