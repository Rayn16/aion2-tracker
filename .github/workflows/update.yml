name: Update tracker
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:       # "Run workflow" button
concurrency: update   # one run at a time
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Update tracker data" || echo "no changes"
          git pull --rebase -q && git push
