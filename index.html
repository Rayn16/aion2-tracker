<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aion2 Group Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0809">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Same look as Premade: red and black, sections down the left, the chosen one in the middle, a status bar along the bottom */
:root {
  --display: "Cinzel", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --bg: #0b0809; --panel: #151012; --raised: #1f181a; --fg: #f4eeee; --muted: #ab9c9e; --line: #33262a;
  --gold: #ff4f5a; --gold-hi: #ffffff; --gold-line: #7a1f28; --accent: #d9202d; --accent-fg: #ffffff; --link: #ff5c66;
  --best: #e8b84a; --good: #3ccf8e; --warn: #e3b341; --bad: #ff6b6b;
  /* chart series, validated for this surface (fixed order, follows the member) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
h1, h2, h3, p { margin: 0; }
a { color: var(--link); }
[hidden] { display: none !important; }

.app { display: grid; grid-template: "rail main" minmax(0, 1fr) "bar bar" auto / auto minmax(0, 1fr); height: 100%; container: app / inline-size; }
.rail { grid-area: rail; display: flex; flex-direction: column; gap: 4px; width: 196px; padding: 14px 10px; background: var(--panel); border-right: 1px solid var(--gold-line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 18px; font: 700 14px/1.15 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); text-decoration: none; }
.brand img { width: 34px; height: 34px; border-radius: 6px; flex: none; }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid transparent; border-radius: 6px; color: var(--muted); font: 600 12.5px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; }
.nav svg { width: 20px; height: 20px; flex: none; }
.nav:hover { color: var(--fg); background: var(--raised); }
.nav[aria-current="page"] { color: var(--gold-hi); border-color: var(--gold-line); background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 18%, transparent), transparent); }
main { grid-area: main; overflow: auto; padding: 22px clamp(16px, 3vw, 32px) 32px; }
.view { max-width: 1320px; margin-inline: auto; display: grid; gap: 18px; align-content: start; }
.bar { grid-area: bar; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; padding: 8px 20px; border-top: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: 13px; }
.bar b { color: var(--fg); font-weight: 500; }
.bar .end { margin-left: auto; }
/* ?embed: inside Premade's Aion 2 page, which has its own sidebar and status bar, so the sections go along the top */
.embed .app { grid-template: "rail" auto "main" minmax(0, 1fr) / minmax(0, 1fr); }
.embed .rail { flex-direction: row; width: auto; padding: 8px clamp(16px, 3vw, 32px); border-right: 0; border-bottom: 1px solid var(--gold-line); overflow-x: auto; }
.embed .brand, .embed .bar { display: none; }
/* live fight (DPS), laid out like Abyss DPS Meter's: a boss card (name, HP, a bar whose trail shows the damage just
   dealt), then a slim bar per player in their class colour with DPS, share and damage on the right; a bar opens to the
   player's top skills. Colours are this page's (Premade's theme); the class colours are fixed */
.bosshp { padding: 8px 12px 10px; border: 1px solid color-mix(in srgb, var(--bad) 30%, var(--line)); border-radius: 10px; background: color-mix(in srgb, var(--bad) 7%, var(--raised)); }
.bosshp .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.bosshp .nm { font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bosshp .nums { font: 500 12.5px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bosshp .pct { font-weight: 700; color: color-mix(in srgb, var(--bad) 75%, var(--fg)); margin-left: 6px; }
.track { position: relative; height: 6px; border-radius: 3px; background: rgb(0 0 0 / 0.35); overflow: hidden; }
.track > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.track > .trail { background: color-mix(in srgb, var(--bad) 35%, transparent); transition: width 1.2s ease 0.4s; }
.track > .fill { background: linear-gradient(90deg, var(--bad), color-mix(in srgb, var(--bad) 55%, var(--fg))); box-shadow: 0 0 10px color-mix(in srgb, var(--bad) 55%, transparent); transition: width 0.3s ease; }
.lhead { display: flex; gap: 8px; padding: 0 10px; font-size: 12px; }
/* icons and colour: a coloured icon in each live section's title, class icons and portraits on the bars, skill icons
   in a player's breakdown, tickets as coloured tiles, the party as cards with their gear's icons */
.ph .ico { width: 18px; height: 18px; flex: none; color: var(--ic, var(--gold)); }
.av { width: 22px; height: 22px; flex: none; border-radius: 6px; object-fit: cover; border: 1px solid rgb(var(--cc, 140 140 150) / 0.8); background: var(--bg); }
.av.ini { display: grid; place-items: center; font: 700 11px/1 var(--body); color: rgb(var(--cc, 160 160 170)); }
.dbar .who b { color: color-mix(in srgb, rgb(var(--cc, 230 230 235)) 55%, var(--fg)); }
.bosshp .nm .ico { width: 16px; height: 16px; color: var(--bad); vertical-align: -3px; margin-right: 6px; }
.dskills { display: grid; gap: 4px; margin: 4px 0 8px 12px; }
.sk { display: grid; grid-template-columns: 24px minmax(90px, 200px) minmax(60px, 1fr) 54px 44px 56px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--fg); }
.sk img, .sk .noimg { width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); }
.sk .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sk .m { height: 6px; border-radius: 3px; background: rgb(0 0 0 / 0.3); overflow: hidden; }
.sk .m > i { display: block; height: 100%; border-radius: 3px; background: rgb(var(--cc, 140 140 150)); }
.sk .n { font: 500 12px/1 var(--mono); text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.sk .n b { color: var(--fg); }
.encrow .ico { width: 15px; height: 15px; color: var(--best); }
.encrow .av { width: 18px; height: 18px; border-radius: 4px; }
.tix { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tk { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--tc) 35%, var(--line)); border-radius: 10px; background: color-mix(in srgb, var(--tc) 9%, var(--raised)); }
.tk .top { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; }
.tk .top .ico { width: 20px; height: 20px; color: var(--tc); }
.tk .v { font: 700 22px/1 var(--mono); color: var(--tc); font-variant-numeric: tabular-nums; }
.tk .v small { font: 500 13px/1 var(--mono); color: var(--muted); }
.tk .v .x { font-size: 14px; color: var(--best); margin-left: 4px; }
.tk .m { height: 5px; border-radius: 3px; background: rgb(0 0 0 / 0.3); overflow: hidden; }
.tk .m > i { display: block; height: 100%; background: var(--tc); }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.pc { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-top: 3px solid rgb(var(--cc, 140 140 150)); border-radius: 10px; background: var(--raised); }
.pc .top { display: flex; align-items: center; gap: 10px; }
.pc .top .av { width: 40px; height: 40px; border-radius: 10px; }
.pc .nm { font-weight: 700; color: color-mix(in srgb, rgb(var(--cc, 230 230 235)) 60%, var(--fg)); }
.pc .sub { font-size: 12.5px; }
.pc .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pc .stats div { display: grid; gap: 2px; }
.pc .stats span { font: 600 10.5px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pc .stats b { font: 700 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.pc .stats b.cp { color: var(--best); }
.gicons { display: flex; flex-wrap: wrap; gap: 4px; }
.gicons span { position: relative; }
.gicons img { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--g, var(--line)); background: var(--bg); display: block; }
.gicons b { position: absolute; right: -3px; bottom: -3px; padding: 0 3px; border-radius: 4px; background: var(--bg); font: 700 9.5px/1.4 var(--mono); color: var(--gold-hi); }
.dbars { display: grid; gap: 4px; }
.dbar { position: relative; display: block; width: 100%; height: 28px; padding: 0; overflow: hidden; border: 1px solid transparent; border-radius: 7px; background: var(--raised); color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.dbar:hover { border-color: var(--gold-line); }
/* your own bar: always Premade's theme colour (the one you picked in Premade), not your class's */
.dbar.mine { border-color: var(--gold-line); }
.dbar.mine > .fill { background: color-mix(in srgb, var(--gold) 45%, transparent); }
.dbar.mine .who b { color: var(--gold-hi); }
.dbar.mine .av { border-color: var(--gold); box-shadow: 0 0 8px color-mix(in srgb, var(--gold) 55%, transparent); }
.dskills.mine .m > i { background: var(--gold); }
.dbar > .fill { position: absolute; inset: 0 auto 0 0; background: rgb(var(--cc, 140 140 150) / 0.42); transition: width 0.4s ease; }
.dbar > .txt { position: relative; display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 10px; font-size: 13px; }
.dbar .dot { width: 10px; height: 10px; flex: none; border-radius: 3px; background: rgb(var(--cc, 140 140 150)); }
.dbar .who { display: flex; align-items: baseline; gap: 6px; flex: 1; min-width: 0; }
.dbar .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbar .you { font: 700 10px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
.dbar .cp, .dbar .cls { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.dbar .n { font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); flex: none; }
.dbar .n.dps { width: 64px; font-weight: 700; color: var(--fg); }
.dbar .n.sh { width: 46px; }
.dbar .n.dmg { width: 58px; }
.dskills { margin: 2px 0 4px 18px; font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.encrow { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); cursor: pointer; font-size: 13px; list-style: none; }
.encrow::-webkit-details-marker { display: none; }
.encrow:hover, details[open] > .encrow { border-color: var(--gold-line); }
.encrow time { font: 500 12px/1 var(--mono); color: var(--muted); }
.encrow .t { font-weight: 600; }
.encrow .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--good); }
.encrow .r { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--muted); }
details.fight { display: grid; gap: 6px; }
details.fight > .dbars { margin: 6px 0 4px; }
details.fight > summary { cursor: pointer; padding: 4px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips > span { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
@container app (max-width: 760px) {
  .rail { width: auto; padding-inline: 6px; }
  .brand span, .nav span { display: none; }
  .nav { justify-content: center; padding: 10px; }
}

svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.title { font: 700 clamp(22px, 2.6vw, 30px)/1.15 var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold-hi); }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--link); margin-bottom: 8px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 600 12px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.hint { color: var(--muted); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 18px; align-items: start; }
@container app (max-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 4px; }
.tile .k { font: 500 11.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tile .v { font: 600 26px/1.15 var(--mono); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.tile .s { font-size: 13px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.btn { font: 600 14px/1 var(--body); padding: 10px 16px; border-radius: 4px; border: 1px solid var(--gold-line); background: var(--raised); color: var(--gold-hi); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.small { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.6; cursor: default; }
input, select { font: 15px/1.2 var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); min-width: 0; }
:is(.btn, .nav, input, select, a, .row):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* leaderboard rows */
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: 8px; background: var(--raised); color: var(--fg); text-decoration: none; }
.row:hover { border-color: var(--gold-line); border-left-color: var(--c); }
.rank { font: 600 14px/1 var(--mono); color: var(--muted); text-align: center; }
.rank.first { color: var(--best); }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 13px; color: var(--muted); }
.num { font: 500 15px/1.2 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* member cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { display: grid; gap: 12px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 8px; color: var(--fg); text-decoration: none; }
.card:hover { border-color: var(--gold-line); border-top-color: var(--c); }
.card .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card .stats div { display: grid; gap: 2px; }
.card .stats span { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card .stats b { font: 600 17px/1.2 var(--mono); font-variant-numeric: tabular-nums; }

/* gear */
.gear { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; }
.item img { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--g, var(--line)); background: var(--bg); }
.item .name { font-size: 14px; }
.ench { font: 600 14px/1 var(--mono); color: var(--gold-hi); }
.grade { font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--g, var(--muted)); }

/* charts */
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font: 11px var(--mono); }
.chart .lbl { font: 600 12px var(--body); fill: var(--fg); }
.tipbox { position: absolute; pointer-events: none; padding: 10px 12px; border: 1px solid var(--gold-line); border-radius: 6px; background: var(--raised); font-size: 13px; box-shadow: 0 12px 32px rgb(0 0 0 / 0.45); white-space: nowrap; z-index: 2; }
.tipbox .d { font: 500 11px var(--mono); color: var(--muted); margin-bottom: 4px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }

.meter { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--good); }

.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; align-items: start; }
.grid2.even { grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
.gear.one { grid-template-columns: minmax(0, 1fr); }
.list { display: grid; gap: 10px; }
ol.list { margin: 0; padding-left: 22px; gap: 6px; }
.mrow { display: grid; gap: 6px; }
.mhead { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.board { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: center; }
.board img { width: 32px; height: 32px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font: 600 12.5px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { color: var(--gold-hi); border-bottom-color: var(--gold); }
table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
table.cmp th, table.cmp td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.cmp th { font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
table.cmp td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { overflow-x: auto; }
table.skills td { vertical-align: middle; }
table.skills img { width: 32px; height: 32px; border-radius: 4px; display: block; }
table.skills tr.next td { background: color-mix(in srgb, var(--gold) 12%, transparent); }
table.skills .meter { min-width: 80px; }
.dboards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; align-items: start; }
.dboard { margin: 0; display: grid; gap: 8px; }
.dboard figcaption { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.dboard figcaption img { width: 24px; height: 24px; }
.dgrid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; aspect-ratio: 1; background: var(--bg); padding: 6px; border-radius: 6px; }
.dgrid i, .dk { display: block; aspect-ratio: 1; border-radius: 2px; border: 1px solid color-mix(in srgb, var(--g, var(--muted)) 55%, transparent); background: color-mix(in srgb, var(--g, var(--muted)) 12%, transparent); }
.dgrid i.on, .dk.on { background: var(--g, var(--muted)); border-color: var(--g, var(--muted)); }
.dgrid i.skill, .dk.skill { border-radius: 50%; }
.dgrid i.start { background: var(--fg); border-radius: 50%; }
.dgrid i.path, .dk.path { outline: 2px solid var(--gold-hi); outline-offset: 0; }
.dgrid i.goal, .dk.goal { outline: 2px solid var(--gold-hi); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold-hi) 35%, transparent); }
.dgrid i { display: grid; place-items: center; }
.dgrid i b { font: 700 clamp(8px, 1.1vw, 12px)/1 var(--mono); color: var(--gold-hi); text-shadow: 0 1px 2px rgb(0 0 0 / 0.9); }
.dboards.big .dgrid i { opacity: 0.45; }
.dboards.big .dgrid i.path, .dboards.big .dgrid i.start { opacity: 1; outline: none; background: color-mix(in srgb, var(--g, var(--muted)) 55%, transparent); border-color: var(--g, var(--muted)); }
.dboards.big .dgrid i.stop { background: color-mix(in srgb, var(--g, var(--muted)) 35%, var(--bg)); outline: 2px solid var(--gold-hi); }
.dboards.big .dgrid i.start { background: var(--fg); }
.dgrid { position: relative; }
.droute { display: none; position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); pointer-events: none; z-index: 1; }

<script>
// Inside Premade's page (same site), take Premade's colours and fonts, so the theme picked in Premade (Settings, Look)
// and its custom colours show here too; again whenever Premade's look changes
(function themeFromPremade() {
  let root; try { root = parent !== window && parent.document.documentElement; } catch { return; }
  if (!root) return;
  const VARS = ['--bg', '--panel', '--raised', '--fg', '--muted', '--line', '--gold', '--gold-hi', '--gold-line', '--accent', '--accent-fg', '--link', '--best', '--good', '--warn', '--bad', '--display', '--body', '--mono'];
  const copy = () => {
    const cs = parent.getComputedStyle(root), me = document.documentElement.style;
    for (const v of VARS) { const x = cs.getPropertyValue(v).trim(); if (x) me.setProperty(v, x); }
    document.documentElement.style.colorScheme = cs.colorScheme || 'dark';
  };
  copy();
  new parent.MutationObserver(copy).observe(root, { attributes: true, attributeFilter: ['style', 'class', 'data-theme'] });
})();
</script>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const GRADE = { Unique: 'var(--best)', Legend: '#eb6834', Legendary: '#eb6834', Epic: '#9085e9', Rare: '#3987e5' };

const low = s => String(s || '').toLowerCase();
// Inside Premade's Aion 2 page this page is on Premade's own site, so it shares Premade's storage and knows, without
// asking, your Riot ID, your friends (added in Premade, and League's friend list) and the id Premade's server knows the app by
const premade = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const ME = premade('lpc-profile')?.n || '';
const FRIENDS = new Set([...(premade('lpc-friends') || []), ...(premade('lpc-lolfriends') || []).map(f => f?.riot)].filter(x => typeof x === 'string').map(low));

const CLAIMS_URL = 'https://league-proxchat.league-proxchat-server.workers.dev/aion';

const isMe = o => !!ME && low(o) === low(ME), isFriend = o => FRIENDS.has(low(o));

function gain(h) {
  // change versus the newest snapshot at least 7 days old, else the oldest we have
  if (!h || h.length < 2) return 0;
  const last = h[h.length - 1], cutoff = new Date(Date.parse(last.date) - 7 * 864e5).toISOString().slice(0, 10);
  const base = [...h].reverse().find(x => x.date <= cutoff) || h[0];
  return last.cp - base.cp;
}

/* line chart: series [{name, color, points:[{date, v}]}], one y axis, crosshair tooltip. Drawn after the page is in
   place so the chart is measured at its real width and its text stays the same size at any window size */
const CHARTS = {};
function lineChart(series, opts = {}) {
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  CHARTS[id] = [series, opts];
  return `<div class="chart" id="${id}"></div>` + (series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="sw" style="--c:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '');
}
function drawCharts() {
  for (const [id, [series, { unit = 'CP', height = 280, empty = 'The trend shows up after the second day of updates.' }]] of Object.entries(CHARTS)) {
    const box = document.getElementById(id); delete CHARTS[id]; if (!box) continue;
    const dates = [...new Set(series.flatMap(s => s.points.map(p => p.date)))].sort();
    if (dates.length < 2) { box.innerHTML = `<p class="hint">${esc(empty)}</p>`; continue; }
    const W = Math.max(280, box.clientWidth), H = height, L = 48, R = series.length > 1 ? 100 : 16, T = 12, B = 28;
    const vals = series.flatMap(s => s.points.map(p => p.v));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo || hi || 1) * 0.08; lo = Math.max(0, lo - pad); hi += pad;
    const x = d => L + dates.indexOf(d) / (dates.length - 1) * (W - L - R);
    const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const ticks = [0, 1, 2, 3].map(i => lo + (hi - lo) * i / 3);
    const n = Math.max(2, Math.min(6, Math.floor((W - L - R) / 90)));
    const xt = dates.length <= n ? dates : [...Array(n).keys()].map(i => dates[Math.round(i * (dates.length - 1) / (n - 1))]);
    const short = d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const lines = series.map(s => {
      const pts = s.points.map(p => `${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
      const last = s.points[s.points.length - 1];
      const label = series.length > 1 && series.length <= 4 ? `<text class="lbl" x="${x(last.date) + 8}" y="${y(last.v) + 4}">${esc(s.name)}</text>` : '';
      return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${x(last.date)}" cy="${y(last.v)}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>${label}`;
    }).join('');
    box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} over time">
        <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
        <g class="axis">${ticks.map(t => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t >= 1e4 && hi - lo > 4e3 ? Math.round(t / 1e3) + 'k' : fmt(Math.round(t))}</text>`).join('')}
          ${xt.map(d => `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${short(d)}</text>`).join('')}</g>
        <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
        ${lines}
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
      </svg><div class="tipbox" hidden></div>`;
    wireChart(id, series, dates, x, W, short, unit);
  }
}

function wireChart(id, series, dates, x, W, short, unit) {
  const box = document.getElementById(id); if (!box) return;
  const svg = box.querySelector('svg'), cross = svg.querySelector('.cross'), tip = box.querySelector('.tipbox');
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const d = dates.reduce((a, b) => Math.abs(x(b) - px) < Math.abs(x(a) - px) ? b : a);
    cross.setAttribute('x1', x(d)); cross.setAttribute('x2', x(d)); cross.setAttribute('visibility', 'visible');
    const rows = series.map(s => [s, s.points.find(p => p.date === d)]).filter(([, p]) => p).sort((a, b) => b[1].v - a[1].v);
    tip.innerHTML = `<div class="d">${short(d)}</div>` + rows.map(([s, p]) => `<div><i class="sw" style="--c:${s.color}"></i>${esc(s.name)} <b>${fmt(p.v)}</b> ${unit}</div>`).join('');
    tip.hidden = false;
    const left = x(d) / W * r.width;
    tip.style.left = (left > r.width / 2 ? left - tip.offsetWidth - 12 : left + 12) + 'px'; tip.style.top = '8px';
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
}

const SIDE_BOARDS = {
  Ariel: ['PvE Damage Boost', 'Boss Damage Boost', 'Critical Hit', 'PvE Attack, PvE Defense', 'Boss Attack, Boss Defense', 'PvE Attack', 'Boss Attack', 'PvE Accuracy'],
  Azphel: ['PvP Damage Boost', 'PvP Damage Tolerance', 'Status Effect Chance', 'PvP Attack, PvP Defense', 'PvP Critical Hit, PvP Critical Hit Resist', 'PvP Attack', 'PvP Critical Hit', 'PvP Accuracy'],
};

function advice(m) {
  const list = m.skill?.skillList || [], b = BUILDS[Math.floor((list[0]?.id || 0) / 1e6)];
  if (!b) return [];
  const byName = n => list.find(x => x.name === n) || { name: n, skillLevel: 0 };
  const picks = [];
  const act = b.active.map(([n, t]) => [byName(n), t]).filter(([s, t]) => s.skillLevel < t).slice(0, 2);
  act.forEach(([s, t]) => picks.push([s, `Skill point: Lv ${s.skillLevel} → ${t}`, 'Rotation skill, next specialty breakpoint']));
  // guides say keep passives even, so the lowest priority passive goes next
  const pas = b.passive.map(byName).reduce((a, s) => s.skillLevel < a.skillLevel ? s : a);
  picks.push([pas, `Skill point: Lv ${pas.skillLevel} → ${pas.skillLevel + 1}`, 'Lowest of your key passives']);
  const st = b.stigma.map(([n, t]) => [byName(n), t]).find(([s, t]) => !s.acquired || !s.equip || s.skillLevel < t);
  if (st) { const [s, t] = st; picks.push([s, !s.acquired ? 'Get this stigma' : !s.equip ? 'Equip this stigma' : `Stigma: Lv ${s.skillLevel} → ${t}`, 'Core stigma for the build']); }
  return [b, picks];
}

// ponytail: crystal cost per node grade from GameWith's planner (Common 1, Rare 2, Epic 3, Unique 4); Legend taken as Epic.
const COST = { Common: 1, Rare: 2, Legend: 3, Unique: 4 };
// These four share the normal Daevanion points; every other board has its own crystals.
const NORMAL = ['Nezekan', 'Zikel', 'Vaizel', 'Triniel'];

// The best closed node on each board to head for, with the cheapest path to it from what's already open.
// Nodes link up, down, left and right. Worth a detour: build skill nodes first, then big stat nodes, then small ones.
const parseBoard = rows => rows.map(r => { const [row, col, grade, open, ...name] = r.split('|'); return { row: +row, col: +col, grade, open: open === '1', name: name.join('|') }; });
// each closed node's cheapest cost from the open ones (cost) and the node it's reached from (prev)
function reach(nodes) {
  const at = new Map(nodes.map(n => [n.row + ',' + n.col, n]));
  nodes.forEach(n => { delete n.cost; delete n.prev; });
  const q = nodes.filter(n => n.open);
  q.forEach(n => n.cost = 0);
  while (q.length) {  // Dijkstra; a board has at most a few hundred nodes, so a sorted array is fine
    q.sort((x, y) => x.cost - y.cost);
    const n = q.shift();
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const o = at.get((n.row + dr) + ',' + (n.col + dc));
      if (o && !o.open && n.cost + COST[o.grade] < (o.cost ?? Infinity)) { o.cost = n.cost + COST[o.grade]; o.prev = n; q.push(o); }
    }
  }
}
// how much a node is worth heading for: [tier, place in its list], or null. Build skills, then big stat nodes, then small
const nodeRank = (b, stats) => {
  const skills = [...b.active.map(x => x[0]), ...b.passive];
  return n => n.name.startsWith('Skill Level Up - ') ? (skills.includes(n.name.slice(17)) ? [0, skills.indexOf(n.name.slice(17))] : null)
    : stats.includes(n.name) ? [n.grade === 'Common' ? 2 : 1, stats.indexOf(n.name)] : null;
};
const before = (x, y) => x.reduce((d, v, i) => d || v - y[i], 0) < 0;

function boardPicks(m, b) {
  const picks = {}, boards = [];
  for (const [id, rows] of Object.entries(m.boards || {})) {
    const board = (m.daevanion?.boardList || []).find(x => x.id == id) || {};
    const nodes = parseBoard(rows);
    reach(nodes);
    boards.push({ board, nodes });
    const stats = SIDE_BOARDS[board.name] || b.stats, rank = nodeRank(b, stats);
    const key = NORMAL.includes(board.name) ? 'Daevanion points' : board.name + ' crystals';
    for (const n of nodes) {
      const r = !n.open && n.cost !== undefined && rank(n);
      if (!r) continue;
      const score = [r[0], n.cost, r[1]], best = picks[key];
      if (best && !before(score, best.score)) continue;
      let first = n, steps = 1;
      while (!first.prev.open) { first = first.prev; steps++; }
      picks[key] = { key, board, node: n, first, steps, score };
    }
  }
  for (const p of Object.values(picks)) {  // mark each pick's path so the board grid can light it up
    for (let n = p.node; !n.open; n = n.prev) n.path = true;
    p.node.goal = true;
    boards.find(x => x.board === p.board).pick = p;
  }
  return { picks: Object.values(picks), boards };
}

// A class guide's path on a fresh board: from the start, again and again the best node to head for (as boardPicks
// picks, except big stat nodes count as much as skill nodes so the path mixes them), opened the cheapest way and
// numbered, up to 15 stops. Gives the nodes and the stops in order.
function guidePath(rows, b, stats) {
  const nodes = parseBoard(rows), r0 = nodeRank(b, stats), stops = [];
  const rank = n => { const r = r0(n); return r && [r[0] === 2 ? 1 : 0, r[1]]; };
  while (stops.length < 15) {
    reach(nodes);
    let best = null;
    for (const n of nodes) {
      const r = !n.open && n.cost !== undefined && rank(n), s = r && [r[0], n.cost, r[1]];
      if (s && (!best || before(s, best.s))) best = { n, s };
    }
    if (!best) break;
    for (let n = best.n; !n.open; n = n.prev) { n.open = true; n.path = true; n.link = n.prev; }
    best.n.pts = best.s[1];
    best.n.num = stops.push(best.n);
  }
  nodes.forEach(n => { n.open = n.grade === 'Start'; });  // drawn as a fresh board: the start lit, the path outlined
  return { nodes, stops };
}

// A Daevanion board as the game draws it: open nodes lit, the suggested path outlined, the goal ringed.
const boardGrid = ({ board, nodes, pick }) => {
  const r0 = Math.min(...nodes.map(n => n.row)), c0 = Math.min(...nodes.map(n => n.col));
  const cols = Math.max(...nodes.map(n => n.col)) - c0 + 1, rows = Math.max(...nodes.map(n => n.row)) - r0 + 1;
  const xy = n => [n.col - c0 + 0.5, n.row - r0 + 0.5];
  const lines = nodes.some(n => n.link) ? `<svg class="droute" viewBox="0 0 ${cols} ${rows}" preserveAspectRatio="none">${nodes.filter(n => n.link).map(n => {
    const [x1, y1] = xy(n), [x2, y2] = xy(n.link); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }).join('')}</svg>` : '';
  return `<figure class="dboard"><figcaption>${board.icon ? `<img src="${esc(board.icon)}" alt="">` : ''}${esc(board.name)} ${board.openNodeCount != null ? `<span class="hint">${fmt(board.openNodeCount)} / ${fmt(board.totalNodeCount)}</span>` : ''}${board.note ? `<span class="note">${board.note}</span>` : ''}</figcaption>
    <div class="dgrid" style="--cols:${cols}">${lines}${nodes.map(n => `<i class="${n.grade === 'Start' ? 'start' : ''}${n.open ? ' on' : ''}${n.path ? ' path' : ''}${n.goal ? ' goal' : ''}${n.num ? ' stop' : ''}${n.name.startsWith('Skill Level Up') ? ' skill' : ''}"
      style="grid-area:${n.row - r0 + 1}/${n.col - c0 + 1};--g:${GRADE[n.grade] || 'var(--muted)'}" title="${n.num ? n.num + '. ' : ''}${esc(n.name)}${n.goal ? ' (goal)' : n.path ? ' (on the way)' : n.open ? ' (open)' : ''}">${n.num ? `<b>${n.num}</b>` : ''}</i>`).join('')}</div>
    ${pick ? `<p class="sub">Goal: <b>${esc(pick.node.name)}</b>, ${pick.node.cost} pts${pick.steps > 1 ? `, open ${esc(pick.first.name)} first` : ''}</p>` : ''}</figure>`;
};
const BOARD_KEY = `<p class="legend"><span><i class="dk on"></i>Open</span><span><i class="dk path"></i>Open next</span><span><i class="dk goal"></i>Goal</span><span><i class="dk skill"></i>Skill node</span><span><i class="dk"></i>Closed</span></p>`;

// The build's skills as one table: level now, the goal, and which ones get the next points.
function skillTable(m, b, picks) {
  const list = m.skill?.skillList || [], byName = n => list.find(x => x.name === n) || { name: n, skillLevel: 0 };
  const next = new Map(picks.map(([s, what]) => [s.name, what]));
  const top = Math.max(...b.passive.map(n => byName(n).skillLevel));  // guides say keep passives even
  const rows = [...b.active.map(([n, t]) => [byName(n), t, 'Active']), ...b.passive.map(n => [byName(n), top, 'Passive']),
    ...b.stigma.filter(([n], i, a) => a.findIndex(x => x[0] === n) === i).map(([n]) => [byName(n), Math.max(...b.stigma.filter(x => x[0] === n).map(x => x[1])), 'Stigma'])];
  return `<table class="cmp skills"><tr><th></th><th>Skill</th><th>Type</th><th class="n">Now</th><th class="n">Goal</th><th>Progress</th></tr>
    ${rows.map(([s, t, type]) => `<tr class="${next.has(s.name) ? 'next' : ''}"><td><img src="${esc(s.icon || '')}" alt=""></td>
      <td>${esc(s.name)}${next.has(s.name) ? `<div class="sub">Next: ${esc(next.get(s.name))}</div>` : ''}</td><td class="sub">${type}</td>
      <td class="n">${s.skillLevel}</td><td class="n">${t}</td>
      <td><div class="meter${s.skillLevel >= t ? '' : ' no'}"><i style="width:${Math.min(100, pct(s.skillLevel, t))}%"></i></div></td></tr>`).join('')}</table>`;
}

function nextUpgrade(m) {
  const [b, picks] = advice(m);
  if (!b) return '<section class="panel"><h2 class="ph">Next upgrade</h2><p class="hint">No build guide for this class yet.</p></section>';
  const { boards } = boardPicks(m, b), shown = boards.filter(x => x.pick);
  return `<section class="panel wrap"><h2 class="ph">Skill points <span class="hint"><a href="#/classes/${b.cls}">${b.cls} guide</a> · highlighted rows get the next points</span></h2>${skillTable(m, b, picks)}</section>
    <section class="panel"><h2 class="ph">Daevanion points go here</h2>
      ${shown.length ? `<div class="dboards">${shown.map(boardGrid).join('')}</div>${BOARD_KEY}` : `<p class="hint">${m.boards ? 'Nothing left on the build path.' : 'The boards arrive with the next update, within 30 minutes.'}</p>`}
      <p class="hint">The four main boards share your Daevanion points; Ariel and Azphel use their own crystals. Counted from what was open at the last update. Refunds cost 500 Kina a node.</p></section>`;
}

        <div class="list">${(t.titleList || []).map(x => `<div><div class="name">${esc(x.name)} <span class="grade" style="--g:${GRADE[x.grade] || 'var(--muted)'}">${esc(x.grade)}</span></div>
          <div class="sub">${esc(x.equipCategory)} · ${(x.equipStatList || []).map(e => esc(e.desc)).join(' · ')}</div></div>`).join('')}</div></section>
      <section class="panel"><h2 class="ph">Daevanion</h2>${dt ? bar('Nodes opened', dn, dt) : '<p class="hint">No data.</p>'}
        <a href="#/member/${encodeURIComponent(m.name)}/stats">See every board</a></section>
    </div>`;
}

function memberSkills(m) {
  const list = m.skill?.skillList || [];
  const group = (title, xs) => xs.length ? `<section class="panel wrap"><h2 class="ph">${title} <span class="hint">${xs.length}</span></h2>
    <table class="cmp skills"><tr><th></th><th>Skill</th><th>Type</th><th class="n">Level</th></tr>${xs.map(x => `<tr><td><img src="${esc(x.icon)}" alt=""></td><td>${esc(x.name)}</td>
      <td class="sub">${x.acquired ? (x.category === 'Dp' ? 'DP skill' : esc(x.category)) : `Unlocks at Lv ${x.needLevel}`}</td><td class="n">${x.skillLevel}</td></tr>`).join('')}</table></section>` : '';
  const used = x => x.equip && x.acquired;
  return group('Equipped active skills', list.filter(x => x.category === 'Active' && used(x)))
    + group('Equipped DP skills', list.filter(x => x.category === 'Dp' && used(x)))
    + group('Passive skills', list.filter(x => x.category === 'Passive' && x.acquired))
    + group('Learned, not equipped', list.filter(x => x.category !== 'Passive' && x.acquired && !x.equip))
    + group('Not learned yet', list.filter(x => !x.acquired))
    || '<div class="panel empty">No skill data yet. It arrives with the next update, within 30 minutes.</div>';
}

function memberStats(m) {
  const stats = (m.stats || []).filter(x => x.type !== 'ItemLevel');
  const base = stats.filter(x => /^[A-Z]{3}$/.test(x.type)), god = stats.filter(x => !/^[A-Z]{3}$/.test(x.type));
  const table = xs => `<table class="cmp">${xs.map(x => `<tr><td>${esc(x.name)}</td><td class="n">${fmt(x.value)}</td><td class="sub">${(x.statSecondList || []).map(esc).join(' · ')}</td></tr>`).join('')}</table>`;
  const boards = m.daevanion?.boardList || [], b = BUILDS[Math.floor((m.skill?.skillList?.[0]?.id || 0) / 1e6)];
  const grids = m.boards && b ? boardPicks(m, b).boards : null;
  return `<section class="panel"><h2 class="ph">Daevanion boards</h2>
      ${grids ? `<div class="dboards">${grids.map(boardGrid).join('')}</div>${BOARD_KEY}`
        : boards.map(b => `<div class="board"><img src="${esc(b.icon)}" alt="" loading="lazy">${bar(esc(b.name), b.openNodeCount, b.totalNodeCount)}</div>`).join('') || '<p class="hint">No data.</p>'}</section>
    <section class="panel wrap"><h2 class="ph">Base stats</h2>${table(base)}</section>
    <section class="panel wrap"><h2 class="ph">Deity stats</h2>${table(god)}</section>`;
}

function member(name, tab) {
  const m = LIST.find(x => x.name === name);
  if (!m) return head('Character', 'Not found') + `<div class="panel empty"><a href="#/legion">Back to the legion</a></div>`;
  const rank = LIST.indexOf(m) + 1, [dn, dt] = daevTotals(m), base = '#/member/' + encodeURIComponent(m.name);
  const tile = (k, v, s) => `<div class="tile"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
  const tabs = [['', 'Overview'], ['gear', 'Gear'], ['skills', 'Skills'], ['stats', 'Stats and Daevanion']];
  return head(`${esc(nick(m.owner))} · ${esc(m.server)} · Level ${m.level}`, `<span class="who">${pic(m, 'big')}${esc(m.name)}</span>`, `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="hint" id="liveMsg"></span>
    <button class="btn" id="live" data-n="${esc(m.name)}">Refresh now</button><a class="btn" href="#/compare?a=${encodeURIComponent(m.name)}">Compare</a></div>`) + `
    <div class="tiles">

    ${tab === 'gear' ? `<section class="panel"><h2 class="ph">Gear checkup</h2>${checkup(m.gear)}</section>
      <section class="panel"><h2 class="ph">Equipment <span class="hint">dots: manastones, diamonds: Theostones, hollow: empty</span></h2>${gearGrid(m.gear)}</section>`
      : tab === 'skills' ? memberSkills(m) : tab === 'stats' ? memberStats(m) : memberOverview(m)}`;
}

// A guide page per class, made from BUILDS: what it does, skills in the order to level them, Daevanion picks,
// and the gear and characters of the legion's players on that class
const classOf = m => Math.floor((m.skill?.skillList?.[0]?.id || 0) / 1e6);
// a legion character's class name, its colour (as "r g b") and its icon
const clsName = m => BUILDS[classOf(m)]?.cls;
const ccStyle = cls => CLASS_RGB[cls] ? `--cc:${CLASS_RGB[cls]}` : '';
const clsIcon = (cls, c = 'cico') => CLASS_CODE[cls] ? `<img class="${c}" src="${NC_ICONS}ICON_${CLASS_CODE[cls]}_SKILL_001.png" alt="${esc(cls)}" title="${esc(cls)}" loading="lazy">` : '';
function classes() {
  return head('Guides', 'Classes') + `<div class="cards">${Object.entries(BUILDS).map(([id, b]) => {
    const n = LIST.filter(m => classOf(m) == id).length;
    return `<a class="card klass" href="#/classes/${b.cls}" style="--c:var(--gold-line);${ccStyle(b.cls)};align-content:start"><div class="who">${clsIcon(b.cls, 'kimg')}<div><div class="name ccls">${b.cls}</div><div class="sub">${b.role} · ${b.weapon}</div><div class="sub">Builds: ${esc(b.name)} · ${esc(b.alt.name)} · ${esc(b.farm.name)}</div></div></div>
      <p class="hint">${b.about}</p><div class="sub">${n ? `${n} in the legion` : ''}</div></a>`; }).join('')}</div>`;
}
// every class's six boards (boards.json, read once a day by fetch.py), loaded the first time a guide opens
let CLASS_BOARDS = null;
const loadClassBoards = () => loadClassBoards.p ||= fetch('boards.json', { cache: 'no-store' }).then(r => r.json())
  .then(d => { CLASS_BOARDS = d.classes; }, () => { CLASS_BOARDS = false; }).then(() => location.hash.startsWith('#/classes/') && route());
// which look the guide's boards use (this browser only)
const look = () => { try { return localStorage.getItem('aion-board-look') || 'tiles'; } catch { return 'tiles'; } };
const GUIDE_KEY = `<p class="legend"><span><i class="dk goal"></i>Numbered: open in this order</span><span><i class="dk on"></i>On the way</span><span><i class="dk skill"></i>Skill node</span><span><i class="dk"></i>Skip for now</span></p>`;
function classGuide(name, which) {
  loadClassBoards();
  const [id, main] = Object.entries(BUILDS).find(([, x]) => x.cls === name) || [];
  if (!main) return head('Guides', 'Not found') + '<div class="panel empty"><a href="#/classes">All classes</a></div>';
  const all = [main, { ...main, ...main.alt }, { ...main, ...main.farm }], at = ['2', '3'].includes(which) ? +which - 1 : 0, b = all[at], base = '#/classes/' + main.cls;
  const builds = `<nav class="tabs">${all.map((x, i) => `<a href="${base}${i ? '/' + (i + 1) : ''}" ${i === at ? 'aria-current="page"' : ''}>${esc(x.name)} build${x.role !== x.name ? ` <span class="hint">${esc(x.role)}</span>` : ''}</a>`).join('')}</nav>`;
  const chars = LIST.filter(m => classOf(m) == id);  // LIST is strongest first
  const icon = n => chars.flatMap(m => m.skill.skillList).find(x => x.name === n)?.icon;
  const row = (i, n, type, goal) => `<tr><td class="n">${i}</td><td>${icon(n) ? `<img src="${esc(icon(n))}" alt="">` : ''}</td><td>${esc(n)}</td><td class="sub">${type}</td><td class="n">${goal}</td></tr>`;
  const order = xs => `<ol class="list">${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
  return head(`${b.role} · ${b.weapon}`, `<span class="who" style="${ccStyle(b.cls)}">${clsIcon(b.cls, 'kimg')}${b.cls}</span>`, '<a class="btn" href="#/classes">All classes</a>') + builds + `
    <section class="panel"><h2 class="ph">${at ? `The ${esc(b.name)} build` : 'The class'}</h2><p>${b.about}</p></section>
    <section class="panel wrap"><h2 class="ph">Skills to level <span class="hint">top to bottom</span></h2>
      <table class="cmp skills"><tr><th class="n">#</th><th></th><th>Skill</th><th>Type</th><th class="n">Goal</th></tr>
        ${b.active.map(([n, t], i) => row(i + 1, n, 'Active', 'Lv ' + t)).join('')}
        ${b.passive.map(n => row('', n, 'Passive', 'Keep even')).join('')}
        ${b.stigma.map(([n, t], i) => row(i + 1, n, 'Stigma', 'Lv ' + t)).join('')}</table>
      <p class="hint">Active skills to their goal first, two at a time; passives level together; stigmas step up in the order shown.</p></section>
    <section class="panel"><h2 class="ph">Daevanion boards <span class="looks">${[['tiles', 'Tiles'], ['route', 'Route'], ['steps', 'Steps']].map(([k, l]) =>
        `<button type="button" data-look="${k}" aria-pressed="${look() === k}">${l}</button>`).join('')}</span></h2>
      <p class="hint">Open the numbered nodes in order; the lit ones on the way lead there.</p>
      ${CLASS_BOARDS ? `<div class="dboards big look-${look()}">${Object.entries(CLASS_BOARDS[b.cls] || {}).map(([deity, rows]) => {
        const stats = SIDE_BOARDS[deity] || b.stats, { nodes, stops } = guidePath(rows, b, stats), names = stops.map(n => n.name);
        // the board's stats in this build's order, then its skills in the order the path reaches them
        const prio = [...stats.filter(s => names.includes(s)), ...new Set(names.filter(n => n.startsWith('Skill Level Up - ')).map(n => n.slice(17)))].slice(0, 5);
        return boardGrid({ board: { name: deity + (deity === 'Ariel' ? ' · PvE' : deity === 'Azphel' ? ' · PvP' : ''), note: `${stops.length} stops · ${stops.reduce((s, n) => s + n.pts, 0)} pts` }, nodes })
          .replace(/<\/figure>$/, `<p class="sub"><b>Node priority</b></p>${order(prio)}<ol class="dsteps">${stops.map(n => `<li><i class="g${n.name.startsWith('Skill Level Up') ? ' skill' : ''}" style="--g:${GRADE[n.grade] || 'var(--muted)'}"></i><span>${esc(n.name.replace('Skill Level Up - ', 'Skill: '))}</span><span class="c">+${n.pts} pts</span></li>`).join('')}</ol></figure>`);
      }).join('')}</div>${GUIDE_KEY}`
        : `<p class="hint">${CLASS_BOARDS === null ? 'Loading the boards…' : 'Couldn’t load the boards. Try again later.'}</p>`}
      <p class="hint">The path is ours, worked out from this guide: the Skill Level Up nodes for the skills above first, then ${esc(b.stats.slice(0, 3).join(', '))} and the rest, big nodes before small ones, each the cheapest way there. Ariel favours ${esc(SIDE_BOARDS.Ariel.slice(0, 2).join(' and '))}, Azphel ${esc(SIDE_BOARDS.Azphel.slice(0, 2).join(' and '))}.</p></section>
    ${chars.length ? `<section class="panel"><h2 class="ph">Gear of the legion’s best ${b.cls} <a class="hint" href="${memberLink(chars[0].name)}">${esc(chars[0].name)}</a></h2>${gearGrid(chars[0].gear)}</section>
    <section class="panel"><h2 class="ph">${b.cls}s in the legion <span class="hint">open one for its own next points</span></h2><div class="cards">${chars.map(charCard).join('')}</div></section>`
      : `<section class="panel"><p class="hint">Nobody in the legion plays ${b.cls} yet. When someone does, their gear and next points show here.</p></section>`}`;
}

// each side: a player (you, then friends, then the rest of the legion), then one of their characters
function compare(params) {
  const find = n => LIST.find(m => m.name === n);
  const firstFriend = PLAYERS.find(p => isFriend(p.id) && !isMe(p.id));
  const a = find(params.get('a')) || playerOf(ME)?.chars[0] || LIST[0];
  if (!a) return head('Legion', 'Compare') + '<div class="panel empty">No characters yet.</div>';
  const b = find(params.get('b')) || firstFriend?.chars[0] || LIST.find(m => m !== a) || a;
  const groups = [['You', PLAYERS.filter(p => isMe(p.id))], ['Friends', PLAYERS.filter(p => isFriend(p.id) && !isMe(p.id))], ['Legion', PLAYERS.filter(p => !isMe(p.id) && !isFriend(p.id))]];
  const pick = (k, m) => `<select id="p${k}" aria-label="Player">${groups.filter(g => g[1].length).map(([l, ps]) => `<optgroup label="${l}">${ps.map(p =>
      `<option value="${esc(p.id)}" ${low(p.id) === low(m.owner) ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>`).join('')}</select>
    <select id="c${k}" aria-label="Character">${(playerOf(m.owner)?.chars || [m]).map(c => `<option ${c === m ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  const diff = (x, y) => { const d = x - y; return d ? `<span class="${d > 0 ? 'up' : 'down'}">${signed(d)}</span>` : '='; };
  const slots = [...new Set([...(a.gear || []), ...(b.gear || [])].map(g => g.slotPosName))];
  const at = (m, s) => (m.gear || []).find(g => g.slotPosName === s);
  return head('Legion', 'Compare', `<div style="display:grid;gap:8px"><div style="display:flex;gap:8px;flex-wrap:wrap">${pick('a', a)}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${pick('b', b)}</div></div>`) + `
    <section class="panel wrap"><table class="cmp">
      <tr><th></th><th>${esc(a.name)}</th><th>${esc(b.name)}</th><th class="n">Difference</th></tr>
      <tr><td>Player</td><td>${esc(nick(a.owner))}</td><td>${esc(nick(b.owner))}</td><td class="n"></td></tr>
      <tr><td>Level</td><td>${a.level}</td><td>${b.level}</td><td class="n">${diff(a.level, b.level)}</td></tr>
      <tr><td>Combat power</td><td>${fmt(a.cp)}</td><td>${fmt(b.cp)}</td><td class="n">${diff(a.cp, b.cp)}</td></tr>
      <tr><td>Item level</td><td>${fmt(a.il)}</td><td>${fmt(b.il)}</td><td class="n">${diff(a.il, b.il)}</td></tr>
      <tr><td>Last 7 days</td><td>${signed(a.gain)}</td><td>${signed(b.gain)}</td><td class="n"></td></tr>
      <tr><td>Daevanion nodes</td><td>${fmt(daevTotals(a)[0])}</td><td>${fmt(daevTotals(b)[0])}</td><td class="n">${diff(daevTotals(a)[0], daevTotals(b)[0])}</td></tr>
      <tr><td>Titles collected</td><td>${fmt(a.title?.ownedCount)}</td><td>${fmt(b.title?.ownedCount)}</td><td class="n">${a.title && b.title ? diff(a.title.ownedCount, b.title.ownedCount) : ''}</td></tr>
      <tr><td>Wings</td><td>${esc(a.petwing?.wing?.name ?? '–')}</td><td>${esc(b.petwing?.wing?.name ?? '–')}</td><td class="n"></td></tr>
    </table></section>
    <section class="panel wrap"><h2 class="ph">Gear by slot</h2><table class="cmp">
      <tr><th>Slot</th><th>${esc(a.name)}</th><th>${esc(b.name)}</th><th class="n">Enchant</th></tr>
      ${slots.map(s => { const x = at(a, s), y = at(b, s); return `<tr><td class="sub">${esc(s)}</td>
        <td>${x ? `${esc(x.name)} <b>+${x.enchantLevel}</b>${stoneRow(x)}` : '–'}</td><td>${y ? `${esc(y.name)} <b>+${y.enchantLevel}</b>${stoneRow(y)}` : '–'}</td>
        <td class="n">${x && y ? diff(x.enchantLevel, y.enchantLevel) : ''}</td></tr>`; }).join('')}
    </table></section>`;
}

// Picking your characters, once: Aion 2's public pages don't say which characters belong to whom
function claimBox() {

    ${claimed.length ? `<div class="rows">${claimed.map((c, i) => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto">

    <form id="findForm" style="display:flex;gap:10px;flex-wrap:wrap"><input id="findName" placeholder="Your Aion 2 character's name" autocomplete="off" style="flex:1;min-width:12em"><button class="btn primary">Search</button></form>

async function claim(body) {
  const r = await fetch(CLAIMS_URL, { method: 'POST', body: JSON.stringify({ id: DEVICE, o: ME, ...body }) }).then(x => x.json()).catch(() => ({ error: 'Premade’s server didn’t answer. Try again in a minute.' }));
  if (r.error) { const m = $('#claimMsg'); m.textContent = r.error; m.hidden = false; return; }

// News: Aion 2's own announcements and patch notes, straight from its news feed (which lets other sites read it)
const NEWS_API = 'https://api-global-community.plaync.com/aion2_global/board/';
let NEWS = null, newsAt = 0;
// the feed's summaries lose the gaps between paragraphs ("update.Boss"), so put one back after a full stop or colon
const plain = s => new DOMParser().parseFromString(String(s || ''), 'text/html').documentElement.textContent.replace(/([.!?:])([A-Z])/g, '$1 $2').trim();
function loadNews() {
  if (Date.now() - newsAt < 10 * 60e3) return;  // at most every 10 minutes, a failed try included
  newsAt = Date.now();
  const board = b => fetch(`${NEWS_API}${b}/article?pageSize=10`).then(r => r.json()).then(r => r.contentList.map(a => ({
    title: a.title, at: a.timestamps.postedAt, sum: plain(a.summary),
    url: a.categoryBoard.boardUrlPattern.replace('{lang}-{country}', 'en-us').replace('{articleId}', a.id) })));
  Promise.all([board('update_en'), board('notice_en')]).then(([u, n]) => { NEWS = { u, n }; }, () => { NEWS = NEWS || { failed: true }; })
    .then(() => /^#\/(today|timers|checklist|news)/.test(location.hash) && route());
}
// a maintenance notice's start, from its "When: October 27, 2026 at 23h30 PDT" line
const maintStart = s => { const m = /([A-Z][a-z]+ \d{1,2}, \d{4}) at (\d{1,2})[h:](\d{2}) (PDT|PST)/.exec(s); return m ? new Date(`${m[1]} ${m[2]}:${m[3]} GMT${m[4] === 'PDT' ? '-0700' : '-0800'}`) : null; };
function news() {
  loadNews();
  if (!NEWS || NEWS.failed) return `<div class="panel empty">${NEWS ? 'Couldn’t reach Aion’s news. Try again later.' : 'Loading…'}</div>`;
  const day = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const kind = s => /maintenance/i.test(s) ? ['Maintenance', 'var(--warn)'] : /patch|update/i.test(s) ? ['Update', 'var(--link)'] : /event|festival|reward|giveaway|celebrat/i.test(s) ? ['Event', 'var(--good)']
    : /ban|restrict|sanction|cheat/i.test(s) ? ['Action', 'var(--bad)'] : /fix|issue|error|known/i.test(s) ? ['Fix', '#b07cff'] : ['Notice', 'var(--muted)'];
  const tagOf = s => { const [k, c] = kind(s); return `<span class="ntag" style="--tc:${c}">${k}</span>`; };
  const list = xs => `<ol class="feed">${xs.map(a => `<li><time>${day(a.at)}</time><span>${tagOf(a.title)}<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
    <div class="sub">${esc(a.sum.slice(0, 160))}${a.sum.length > 160 ? '…' : ''}</div></span></li>`).join('')}</ol>`;
  const soon = NEWS.n.filter(a => /maintenance/i.test(a.title) && !/complete/i.test(a.title) && Date.now() - Date.parse(a.at) < 4 * 864e5);
  return soon.map(a => { const t = maintStart(a.sum); return `<div class="banner"><b>Maintenance coming</b>${t && !isNaN(t)
      ? `: starts ${t.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}, your time` : ''}.
      <a href="${esc(a.url)}" target="_blank" rel="noopener">Details</a></div>`; }).join('') + `
    <div class="grid2 even"><section class="panel"><h2 class="ph">Patch notes</h2>${list(NEWS.u)}</section>
      <section class="panel"><h2 class="ph">Announcements</h2>${list(NEWS.n)}</section></div>`;
}

// Timers: Aion 2's resets and hourly events, and the field bosses the legion marks killed (kept by Premade's server,
// /aion/boss), each with when it's back; Premade warns 5 minutes before one on your server respawns
const BOSS_URL = CLAIMS_URL + '/boss';
// respawn after a kill (minutes): Verteron's on Elyos servers (race 1), Altgard's on Asmodian ones (race 2). NCSOFT
// hasn't published global ones; these are thegameswiki.com/aion-2/wiki/field-bosses (CC BY-NC-SA 4.0), the times since
// Dec 17, 2025, which aion2atlas.app's global kill reports match
const BOSSES = {
  1: { 30: ['Kernon of the West', 'Neikel of the East', 'Rotten Kutar'], 60: ['Blooming Korin'], 90: ['Bodyguard Teegant'],
    120: ['Kusan the Mad Gladiator', 'Ritualist Garshim', 'Scholar Aulla', 'Chaser Taulo'],
    180: ['Bloodfang Pnyn', 'Furious Saursus', 'Heretic Layla', 'Harvest Manager Moshav'],
    240: ['Forest Warrior Aullamu', 'Black Tentacle Lawa', 'Centurion Demiros', "Sentinel K'nash"],
    360: ['Divine Ansas', 'Researcher Setram', 'Phantasm Kasia', 'Silent Dartan', 'Soul Ruler Kashapa'],
    720: ['High Commander Lagta', 'Eternal Gartua'] },
  2: { 30: ['Melted Danar', 'Black Warrior Aed', 'Faithful Rajit'], 60: ['Berserker Vargor'], 90: ['Blood Warrior Lannar'],
    120: ['Predator Garsan', 'Deceiver Trid', 'Blue Wave Kelpina', 'High Overseer Nutah'],
    180: ['Advisor Resana', 'Special Operations Leader Linx', 'Addicted Hardirun', 'Veteran Shujakan'],
    240: ['Desecrator Newbold', 'Specter Archon Axios', 'Executioner Barthien', 'Visionary Karuka'],
    360: ['Drakan Battalion Weapon Guruta', 'Dark Shadow Vishwada', 'Sharp Shylak', 'Silent Dartan', 'Soul Ruler Kashapa'],
    720: ['High Commander Lagta', 'Immortal Gartua'] },
};
const bossesOf = race => Object.entries(BOSSES[race] || {}).flatMap(([min, ns]) => ns.map(n => ({ n, min: +min })));
// the daily reset is 07:00 UTC (the game's notices: 12:00 AM PDT, 8:00 AM CET), the weekly one Wednesday's
const lastReset = per => { let t = Math.floor((Date.now() - 7 * 36e5) / 864e5) * 864e5 + 7 * 36e5; while (per === 'week' && new Date(t).getUTCDay() !== 3) t -= 864e5; return t; };
const nextReset = per => lastReset(per) + (per === 'week' ? 7 : 1) * 864e5;
const nextAt = min => { const d = new Date(); d.setUTCMinutes(min, 0, 0); return +d > Date.now() ? +d : +d + 36e5; };  // the next hh:min
const clock = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const weekday = t => new Date(t).toLocaleDateString('en-GB', { weekday: 'long' });
const span = ms => { const m = Math.max(1, Math.round(ms / 6e4)); return m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${Math.floor(m / 1440)} d ${Math.floor(m % 1440 / 60)} h`; };
let KILLS = [];
const loadKills = () => fetch(BOSS_URL, { cache: 'no-store' }).then(r => r.json()).then(r => { KILLS = r.kills || []; }, () => {});
const raceOf = s => LIST.find(m => m.server === s)?.race;
const myServers = () => [...new Set(mine().map(m => m.server || m.s))];
const warnOn = () => { try { return localStorage.getItem('aion-warn') !== '0'; } catch { return true; } };
const inPremade = () => { try { return !!parent.aionNotify; } catch { return false; } };
// a kill, a tick or a fight to Premade's server: '' once it's kept, else why not
const said = (url, body) => fetch(url, { method: 'POST', body: JSON.stringify({ id: DEVICE, o: ME, ...body }) }).then(x => x.json())
  .then(r => r.error || '', () => 'Premade’s server didn’t answer. Try again in a minute.');
// Today: the resets and hourly events as countdown rings, then your entry tickets as the game counts them
function timers() {
  const now = Date.now();
  // a ring that fills as the time gets closer: period is how long a full turn is
  const ring = (left, period, icon, up) => `<span class="ring ${up ? 'up' : left < 10 * 6e4 ? 'soon' : ''}" style="--p:${up ? 100 : Math.max(0, Math.min(100, 100 - (left / period) * 100)).toFixed(1)}">${ico(icon)}</span>`;

  const count = all.reduce((m, f) => m.set(f.tg, (m.get(f.tg) || 0) + 1), new Map()), targets = [...count.keys()].sort((a, b) => count.get(b) - count.get(a));
  const tg = count.has(params.get('tg')) ? params.get('tg') : own.length ? own[own.length - 1].tg : targets[0];
  const who = f => f.c || nick(f.o), member = f => LIST.find(m => m.name === f.c), on_tg = all.filter(f => f.tg === tg);
  const best = [...on_tg.reduce((m, f) => { const b = m.get(who(f)); return m.set(who(f), !b || f.d > b.d ? f : b); }, new Map()).values()].sort((a, b) => b.d - a.d);
  const day = at => new Date(at).toLocaleDateString('en-CA');  // YYYY-MM-DD, your time
  const series = best.map(b => {
    const byDay = new Map();
    for (const f of on_tg.filter(f => who(f) === who(b))) byDay.set(day(f.at), Math.max(byDay.get(day(f.at)) || 0, f.d));
    return { name: who(b), color: member(b)?.color || 'var(--muted)', points: [...byDay].sort(([a], [c]) => a < c ? -1 : 1).map(([date, v]) => ({ date, v })) };
  });
  const when = at => new Date(at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const status = !ME ? '<p class="hint">Open this in Premade’s Aion 2 page, in Premade’s app for Windows: it reads your fights off Aion 2’s Combat Analysis (Ctrl+X).</p>'
    : now - (st.w || 0) < 90e3 ? `<p class="hint"><b class="up">Premade is watching Aion 2.</b> After a fight, open Combat Analysis (Ctrl+X) for a few seconds and the fight is saved here${st.s ? `. It last saw Combat Analysis ${span(now - st.s)} ago` : ''}.</p>`
    : '<p class="hint">While Aion 2 is open, Premade’s app for Windows reads each of your fights off Combat Analysis (Ctrl+X) once its numbers stop: battle time, DPS, total damage, target and top skills. It sees only Aion 2’s window, so play in Borderless or Windowed mode.</p>';
  return head('Aion 2', 'DPS', targets.length > 1 ? `<select id="dpsTarget" aria-label="Target">${targets.map(x => `<option value="${esc(x)}" ${x === tg ? 'selected' : ''}>${esc(x || 'No target read')}</option>`).join('')}</select>` : '') + `
    ${livePanel()}${pastPanel()}
    <section class="panel"><h2 class="ph">Combat Analysis fights <span class="hint">your own, read off the game’s screen, shared with the legion</span></h2>${status}${ME && inPremade() ? `<label class="hint"><input type="checkbox" id="dpsOn" ${on ? 'checked' : ''}>Read my fights off Combat Analysis</label>` : ''}
      ${fightsErr ? `<p class="hint">${esc(fightsErr)}</p>` : ''}</section>` + (!all.length ? '<div class="panel empty">No fights yet.</div>' : `
    <section class="panel wrap"><h2 class="ph">Best on ${esc(tg || 'no target')} <span class="hint">${on_tg.length} fight${on_tg.length === 1 ? '' : 's'}</span></h2>
      <table class="cmp"><tr><th>Character</th><th>Best DPS</th><th>Battle time</th><th>Total damage</th><th>Fights</th><th>When</th></tr>
      ${best.map(f => { const m = member(f), cls = m && BUILDS[classOf(m)]?.cls; return `<tr><td><i class="sw" style="--c:${m?.color || 'var(--muted)'}"></i>${m ? `<a href="${memberLink(f.c)}">${esc(f.c)}</a>` : esc(f.c || 'Character not known')}
        <span class="sub">${cls ? esc(cls) + ' · ' : ''}${esc(nick(f.o))}</span>${tag(f.o)}</td><td class="n"><b>${fmt(f.d)}</b></td><td class="n">${mmss(f.t)}</td><td class="n">${fmt(f.dmg)}</td>
        <td class="n">${on_tg.filter(x => who(x) === who(f)).length}</td><td>${when(f.at)}</td></tr>`; }).join('')}</table></section>
    <section class="panel"><h2 class="ph">Best DPS each day on ${esc(tg || 'no target')}</h2>${lineChart(series, { unit: 'DPS', empty: 'The chart starts once there are fights on two different days.' })}</section>`) + (own.length ? `
    <section class="panel wrap"><h2 class="ph">Your fights <span class="hint">newest first</span></h2>
      <table class="cmp"><tr><th>When</th><th>Target</th><th>DPS</th><th>Time</th><th>Damage</th><th>Top skills</th><th></th></tr>
      ${own.slice(-20).reverse().map(f => `<tr><td>${when(f.at)}</td><td>${esc(f.tg || '–')}</td><td class="n"><b>${fmt(f.d)}</b></td><td class="n">${mmss(f.t)}</td><td class="n">${fmt(f.dmg)}</td>
        <td class="sub">${f.k.slice(0, 3).map(([n, , pc]) => `${esc(n)} ${pc}%`).join(' · ') || '–'}</td><td><button class="btn small" data-fight="${f.at}" aria-label="Remove this fight">✕</button></td></tr>`).join('')}</table></section>` : '') + `
    <p class="hint">Combat Analysis shows only your own character, so a friend’s fights show here once they run Premade too. Premade reads only Aion 2’s window as you see it, never the game’s files or its network traffic.</p>`;
}

// every 30 s: the 5-minute boss warnings (through Premade, or the browser's notifications) and the card Premade's
// overlay shows over Aion 2 (Alt+V): the next respawns on your servers, the daily reset, what your best character
// still has to do today
const say = text => { try { if (parent.aionNotify) return parent.aionNotify(text); } catch {} if (window.Notification?.permission === 'granted') new Notification('Aion 2', { body: text, icon: 'icon-192.png' }); };
let warned; try { warned = new Set(JSON.parse(localStorage.getItem('aion-warned')) || []); } catch { warned = new Set(); }
function aionBeat() {
  if (!ME) return;
  const now = Date.now(), servers = myServers();
  const next = KILLS.filter(k => servers.includes(k.s)).map(k => { const b = bossesOf(raceOf(k.s)).find(x => x.n === k.b); return b && { ...k, due: k.at + b.min * 6e4 }; })
    .filter(k => k && k.due > now).sort((a, b) => a.due - b.due);
  for (const k of next.filter(k => k.due - now <= 5 * 6e4)) {
    const key = `${k.s}|${k.b}|${k.at}`;
    if (!warned.has(key) && warnOn()) say(`${k.b} comes back in ${span(k.due - now)}, at ${clock(k.due)}`);
    warned.add(key);
  }
  const tix = Object.values(premade('lpc-aion-tickets') || {}).filter(x => TICKETS[x.id] && x.id !== 60000001).map(x => `${TICKETS[x.id][0]} ${x.left}`).join(' · ');
  try {
    localStorage.setItem('aion-warned', JSON.stringify([...warned].slice(-50)));
    localStorage.setItem('lpc-aion-card', JSON.stringify({ at: now, lines: [...next.slice(0, 3).map(k => `${k.b} in ${span(k.due - now)}`),
      `Daily reset in ${span(nextReset('day') - now)}`, ...(tix ? [tix] : [])] }));
  } catch {}
}

// the old Settings page, now the end of Profile: who you are, picking your characters (unless Profile already asks above), about
function settings(ask) {
  return (ME ? `
    <section class="panel"><h2 class="ph">Found automatically</h2>
      <p class="hint">From Premade: you’re <b>${esc(ME)}</b>, with ${FRIENDS.size} friends. Change your League account or friends in Premade and this follows.</p></section>
    ${ask ? claimBox() : ''}` : `
    <section class="panel"><h2 class="ph">Your profile</h2><p class="hint">Open this in Premade’s Aion 2 page: it knows your League account and your friends there, so your profile sets itself up.</p></section>`) + `
    <section class="panel" id="about"><h2 class="ph">About</h2><p class="hint">Stats come from the official AION 2 character pages (Europe), updated every 30 minutes. Not affiliated with NCSOFT.</p></section>`;
}

function route() {
  const [path, query] = location.hash.slice(2).split('?');
  const [page, arg, sub] = path.split('/');
  const params = new URLSearchParams(query);
  const cur = ['member', 'compare'].includes(page) ? 'legion' : ['timers', 'checklist', 'news'].includes(page) ? 'today' : page === 'settings' ? '' : page || '';
  document.querySelectorAll('.nav').forEach(a => a.dataset.r === cur ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const v = $('#view');
  v.innerHTML = page === 'legion' ? legion() : page === 'member' ? member(decodeURIComponent(arg || ''), sub)
    : page === 'classes' ? (arg ? classGuide(decodeURIComponent(arg), sub) : classes())
    : page === 'compare' ? compare(params) : ['today', 'timers', 'checklist', 'news'].includes(page) ? timers() : page === 'dps' ? dpsPage(params)
    : profile();
  drawCharts();
  phIcons();
  wireLive();
  document.querySelectorAll('[data-look]').forEach(b => b.onclick = () => { try { localStorage.setItem('aion-board-look', b.dataset.look); } catch {} route(); });
  $('main').scrollTop = 0;
  if (page === 'settings') ($('#claims') || $('#about'))?.scrollIntoView();  // old Settings links land on Profile's end
  const go = (a, b) => location.hash = `#/compare?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`;
  const top = id => playerOf(id)?.chars[0]?.name;
  $('#pa')?.addEventListener('change', e => go(top(e.target.value), $('#cb').value));
  $('#pb')?.addEventListener('change', e => go($('#ca').value, top(e.target.value)));
  $('#ca')?.addEventListener('change', () => go($('#ca').value, $('#cb').value));
  $('#cb')?.addEventListener('change', () => go($('#ca').value, $('#cb').value));
  const mineNow = CLAIMS.filter(c => isMe(c.o));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { b.disabled = true; const c = mineNow[b.dataset.del]; claim({ n: c.n, s: c.s, del: true }); });
  // Refresh now: this character's sheet live from PLAYNC through Premade's server, shown until the next update brings it
  $('#live')?.addEventListener('click', async e => {
    const b = e.target, m = DATA.members[b.dataset.n], msg = $('#liveMsg');
    b.disabled = true; b.textContent = 'Refreshing…';
    const live = await fetch(`${CLAIMS_URL}?q=${encodeURIComponent(b.dataset.n)}&s=${encodeURIComponent(m.server)}`).then(r => r.ok ? r.json() : null).catch(() => null);
    if (!live) { b.disabled = false; b.textContent = 'Refresh now'; msg.textContent = 'Couldn’t reach Aion’s site. Try again in a minute.'; return; }
    const today = new Date().toISOString().slice(0, 10);
    // the live sheet has no item details: an item that didn't change keeps the ones from the last update
    const was = new Map((m.gear || []).map(g => [g.slotPosName, g]));
    live.gear?.forEach(g => { const o = was.get(g.slotPosName); if (o && 'max' in o && o.name === g.name && o.enchantLevel === g.enchantLevel) Object.assign(g, { ...o, icon: g.icon }); });
    Object.assign(m, live, { history: [...m.history.filter(h => h.date !== today), { date: today, cp: live.cp, il: live.il }] });
    load(DATA);
    $('#liveMsg').textContent = 'Live from Aion just now';
  });
  $('#tServer')?.addEventListener('change', e => location.hash = '#/timers?s=' + encodeURIComponent(e.target.value));
  $('#dpsTarget')?.addEventListener('change', e => location.hash = '#/dps?tg=' + encodeURIComponent(e.target.value));
  $('#dpsOn')?.addEventListener('change', e => { try { localStorage.setItem('aion-dps', e.target.checked ? '1' : '0'); } catch {} });
  // a removed fight stays in Premade's list, marked, so Premade doesn't save it again when Combat Analysis shows it again
  document.querySelectorAll('[data-fight]').forEach(b => b.onclick = () => {
    try { localStorage.setItem('lpc-aion-fights', JSON.stringify((premade('lpc-aion-fights') || []).map(f => f.at === +b.dataset.fight ? { ...f, x: 1 } : f))); } catch {}
    rerender();
    sendFights();
  });
  $('#warnBoss')?.addEventListener('change', e => {
    try { localStorage.setItem('aion-warn', e.target.checked ? '1' : '0'); } catch {}
    if (e.target.checked && !inPremade() && window.Notification?.permission === 'default') Notification.requestPermission();
  });
  const tell = (el, text) => { el.hidden = false; el.textContent = text; };
  document.querySelectorAll('[data-boss]').forEach(sel => sel.onchange = async () => {
    const v = sel.value;
    sel.disabled = true;
    const err = await said(BOSS_URL, { s: sel.dataset.s, b: sel.dataset.boss, ...(v === 'del' ? { del: true } : { at: Date.now() - v * 6e4 }) });
    if (!err) return loadKills().then(rerender);
    sel.disabled = false;
    tell($('#bossMsg'), err);
  });
  // a tick shows at once, and goes back if the server says no
  const find = $('#findForm');
  if (!find) return;
  find.addEventListener('submit', async e => {
    e.preventDefault();
    const box = $('#found'); box.innerHTML = '<p class="hint">Searching…</p>';
    try {
      // through Premade's server: PLAYNC's search turns away other sites' pages
      const hits = (await fetch(`${CLAIMS_URL}?q=${encodeURIComponent($('#findName').value.trim())}`).then(x => x.json())).list;
      box.innerHTML = hits.length ? hits.map((c, i) => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto">
        <span><div class="name">${esc(c.n)}</div><div class="sub">${esc(c.s)} · Level ${c.level}</div></span>
        <button class="btn small" data-i="${i}" ${CLAIMS.some(x => isMe(x.o) && x.n === c.n && x.s === c.s) ? 'disabled>Yours' : '>This is mine'}</button></div>`).join('') : '<p class="hint">No characters with that name in Europe. Type your character’s name.</p>';
      box.querySelectorAll('button:not(:disabled)').forEach(b => b.onclick = () => { const c = hits[b.dataset.i]; b.disabled = true; b.textContent = 'Adding…'; claim({ n: c.n, s: c.s }); });
    } catch { box.innerHTML = '<p class="hint">Search failed. Check your internet connection.</p>'; }
  });
}

async function loadClaims() {
  CLAIMS = await fetch(CLAIMS_URL, { cache: 'no-store' }).then(r => r.json()).then(r => r.chars || []).catch(() => CLAIMS);
  group();
}

// players from the characters' owners (members.txt or a claim), ranked by their strongest character
function group() {
  const by = new Map();
  for (const m of LIST) {
    m.owner = m.owner || CLAIMS.find(c => low(c.n) === low(m.name))?.o || '';
    const k = low(m.owner);
    if (!by.has(k)) by.set(k, { id: m.owner, name: nick(m.owner), chars: [] });
    by.get(k).chars.push(m);
  }
  // the unclaimed ones go last, whatever their combat power
  PLAYERS = [...by.values()].sort((a, b) => !a.id - !b.id || b.chars[0].cp - a.chars[0].cp);
  $('#barCount').innerHTML = `<b>${PLAYERS.length}</b> players · <b>${LIST.length}</b> characters`;
}

// the same page again, where it was scrolled to: new data, a tick, the countdowns
const rerender = () => { const top = $('main').scrollTop; route(); $('main').scrollTop = top; };

function load(data) {
  DATA = data;
  const order = Object.keys(data.members); // colour follows the member, never their rank
  LIST = Object.entries(data.members).map(([name, m]) => ({ name, ...m, gain: gain(m.history), color: `var(--s${order.indexOf(name) % 8 + 1})` }))
    .sort((a, b) => b.cp - a.cp);
  $('#barUpdated').innerHTML = data.updated ? `Updated <b>${esc(data.updated)}</b>` : 'Not updated yet';
  group();
  rerender();
  // Premade opens this page in the background for Aion 2 players, for the boss warnings and its overlay card
  try { if (ME) localStorage[mine().length ? 'setItem' : 'removeItem']('lpc-aion', '1'); } catch {}
  aionBeat();
  sendFights();
}

addEventListener('hashchange', route);
// pick up each new update while the page stays open (GitHub Pages may serve the old file for up to 10 minutes)
setInterval(() => fetch('data.json', { cache: 'no-store' }).then(r => r.json()).then(d => d.updated !== DATA.updated && load(d)).catch(() => {}), 5 * 60e3);
Promise.all([fetch('data.json', { cache: 'no-store' }).then(r => r.json()).catch(() => ({ members: {} })), loadClaims(), loadKills()]).then(([d]) => load(d));
// Premade's server shares a daily request budget with voice, so the kills and ticks come on opening, after your own
// change and when Premade shows this page again (aionShown), then every 2 minutes only while it's in sight; the
// countdowns move every 30 s from what's known
const inSight = () => { try { return document.visibilityState === 'visible' && (!frameElement || frameElement.checkVisibility()); } catch { return document.visibilityState === 'visible'; } };
let beats = 0, fetchedAt = Date.now();
const refetch = () => { fetchedAt = Date.now(); return Promise.all([loadKills(), location.hash.startsWith('#/dps') && loadFights()]); };
window.aionShown = () => { if (Date.now() - fetchedAt > 30e3) refetch().then(rerender); };
setInterval(() => {
  const page = location.hash.slice(2).split(/[/?]/)[0];
  (++beats % 4 === 0 && inSight() ? refetch() : Promise.resolve()).then(() => {
    aionBeat();
    if (['today', 'timers', 'checklist', 'news', 'dps'].includes(page) && inSight() && document.activeElement?.tagName !== 'SELECT') rerender();
  });
}, 30e3);
// Premade saved a fight (send it), or its watching changed
addEventListener('storage', e => {
  const page = location.hash.slice(2).split(/[/?]/)[0], calm = inSight() && document.activeElement?.tagName !== 'SELECT';
  if (e.key === 'lpc-aion-live' && page === 'dps' && calm) refreshLive();
  if ((e.key === 'lpc-aion-history' && page === 'dps') || (e.key === 'lpc-aion-tickets' && ['today', 'timers', 'checklist', 'news'].includes(page)) || (e.key === 'lpc-aion-party' && page === '')) { if (calm) rerender(); }
  if (e.key === 'lpc-aion-fights') sendFights();
  if ((e.key === 'lpc-aion-fights' || e.key === 'lpc-aion-dps') && location.hash.startsWith('#/dps') && inSight() && document.activeElement?.tagName !== 'SELECT') rerender();
});
</script>
</body>
</html>
