<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aion2 Group Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0809">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Same look as Premade: red and black, sections down the left, the chosen one in the middle, a status bar along the bottom */
:root {
  --display: "Cinzel", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --bg: #0b0809; --panel: #151012; --raised: #1f181a; --fg: #f4eeee; --muted: #ab9c9e; --line: #33262a;
  --gold: #ff4f5a; --gold-hi: #ffffff; --gold-line: #7a1f28; --accent: #d9202d; --accent-fg: #ffffff; --link: #ff5c66;
  --best: #e8b84a; --good: #3ccf8e; --warn: #e3b341; --bad: #ff6b6b;
  /* chart series, validated for this surface (fixed order, follows the member) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
h1, h2, h3, p { margin: 0; }
a { color: var(--link); }
[hidden] { display: none !important; }

.app { display: grid; grid-template: "rail main" minmax(0, 1fr) "bar bar" auto / auto minmax(0, 1fr); height: 100%; container: app / inline-size; }
.rail { grid-area: rail; display: flex; flex-direction: column; gap: 4px; width: 196px; padding: 14px 10px; background: var(--panel); border-right: 1px solid var(--gold-line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 18px; font: 700 14px/1.15 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); text-decoration: none; }
.brand img { width: 34px; height: 34px; border-radius: 6px; flex: none; }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid transparent; border-radius: 6px; color: var(--muted); font: 600 12.5px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; }
.nav svg { width: 20px; height: 20px; flex: none; }
.nav:hover { color: var(--fg); background: var(--raised); }
.nav[aria-current="page"] { color: var(--gold-hi); border-color: var(--gold-line); background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 18%, transparent), transparent); }
main { grid-area: main; overflow: auto; padding: 22px clamp(16px, 3vw, 32px) 32px; }
.view { max-width: 1320px; margin-inline: auto; display: grid; gap: 18px; align-content: start; }
.bar { grid-area: bar; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; padding: 8px 20px; border-top: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: 13px; }
.bar b { color: var(--fg); font-weight: 500; }
.bar .end { margin-left: auto; }
/* ?embed: inside Premade's Aion 2 page, which has its own sidebar and status bar, so the sections go along the top */
.embed .app { grid-template: "rail" auto "main" minmax(0, 1fr) / minmax(0, 1fr); }
.embed .rail { flex-direction: row; width: auto; padding: 8px clamp(16px, 3vw, 32px); border-right: 0; border-bottom: 1px solid var(--gold-line); overflow-x: auto; }
.embed .brand, .embed .bar { display: none; }
@container app (max-width: 760px) {
  .rail { width: auto; padding-inline: 6px; }
  .brand span, .nav span { display: none; }
  .nav { justify-content: center; padding: 10px; }
}

svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.title { font: 700 clamp(22px, 2.6vw, 30px)/1.15 var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold-hi); }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--link); margin-bottom: 8px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 600 12px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.hint { color: var(--muted); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 18px; align-items: start; }
@container app (max-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 4px; }
.tile .k { font: 500 11.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tile .v { font: 600 26px/1.15 var(--mono); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.tile .s { font-size: 13px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.btn { font: 600 14px/1 var(--body); padding: 10px 16px; border-radius: 4px; border: 1px solid var(--gold-line); background: var(--raised); color: var(--gold-hi); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.small { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.6; cursor: default; }
input, select { font: 15px/1.2 var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); min-width: 0; }
:is(.btn, .nav, input, select, a, .row):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* leaderboard rows */
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: 8px; background: var(--raised); color: var(--fg); text-decoration: none; }
.row:hover { border-color: var(--gold-line); border-left-color: var(--c); }
.rank { font: 600 14px/1 var(--mono); color: var(--muted); text-align: center; }
.rank.first { color: var(--best); }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 13px; color: var(--muted); }
.num { font: 500 15px/1.2 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* member cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { display: grid; gap: 12px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 8px; color: var(--fg); text-decoration: none; }
.card:hover { border-color: var(--gold-line); border-top-color: var(--c); }
.card .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card .stats div { display: grid; gap: 2px; }
.card .stats span { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card .stats b { font: 600 17px/1.2 var(--mono); font-variant-numeric: tabular-nums; }

/* gear */
.gear { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; }
.item img { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--g, var(--line)); background: var(--bg); }
.item .name { font-size: 14px; }
.ench { font: 600 14px/1 var(--mono); color: var(--gold-hi); }
.grade { font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--g, var(--muted)); }

/* charts */
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font: 11px var(--mono); }
.chart .lbl { font: 600 12px var(--body); fill: var(--fg); }
.tipbox { position: absolute; pointer-events: none; padding: 10px 12px; border: 1px solid var(--gold-line); border-radius: 6px; background: var(--raised); font-size: 13px; box-shadow: 0 12px 32px rgb(0 0 0 / 0.45); white-space: nowrap; z-index: 2; }
.tipbox .d { font: 500 11px var(--mono); color: var(--muted); margin-bottom: 4px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }

/* raid check */
.status { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.status.ok { color: var(--good); } .status.no { color: var(--bad); }
.meter { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--good); }
.meter.no i { background: var(--bad); }

.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; align-items: start; }
.grid2.even { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.gear.one { grid-template-columns: minmax(0, 1fr); }
.list { display: grid; gap: 10px; }
.mrow { display: grid; gap: 6px; }
.mhead { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.board { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: center; }
.board img { width: 32px; height: 32px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font: 600 12.5px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { color: var(--gold-hi); border-bottom-color: var(--gold); }
table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
table.cmp th, table.cmp td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.cmp th { font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
table.cmp td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { overflow-x: auto; }
table.skills td { vertical-align: middle; }
table.skills img { width: 32px; height: 32px; border-radius: 4px; display: block; }
table.skills tr.next td { background: color-mix(in srgb, var(--gold) 12%, transparent); }
table.skills .meter { min-width: 80px; }
.dboards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; align-items: start; }
.dboard { margin: 0; display: grid; gap: 8px; }
.dboard figcaption { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.dboard figcaption img { width: 24px; height: 24px; }
.dgrid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; aspect-ratio: 1; background: var(--bg); padding: 6px; border-radius: 6px; }
.dgrid i, .dk { display: block; aspect-ratio: 1; border-radius: 2px; border: 1px solid color-mix(in srgb, var(--g, var(--muted)) 55%, transparent); background: color-mix(in srgb, var(--g, var(--muted)) 12%, transparent); }
.dgrid i.on, .dk.on { background: var(--g, var(--muted)); border-color: var(--g, var(--muted)); }
.dgrid i.skill, .dk.skill { border-radius: 50%; }
.dgrid i.start { background: var(--fg); border-radius: 50%; }
.dgrid i.path, .dk.path { outline: 2px solid var(--gold-hi); outline-offset: 0; }
.dgrid i.goal, .dk.goal { outline: 2px solid var(--gold-hi); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold-hi) 35%, transparent); }
.dk { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <a class="brand" href="#/"><img src="icon.svg" alt=""><span>Aion2 Tracker</span></a>
    <a class="nav" href="#/" data-r=""><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span></a>
    <a class="nav" href="#/members" data-r="members"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.4 0 4 1.5 4.5 4"/></svg><span>Members</span></a>
    <a class="nav" href="#/raid" data-r="raid"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Raid check</span></a>
    <a class="nav" href="#/compare" data-r="compare"><svg class="i" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16M4 8h4M4 16h4M16 8h4M16 16h4"/></svg><span>Compare</span></a>
    <a class="nav" href="#/settings" data-r="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></a>
  </nav>
  <main><div class="view" id="view"></div></main>
  <footer class="bar">
    <span id="barUpdated">Loading…</span>
    <span id="barCount"></span>
    <span class="end"><a href="https://rayn16.github.io/aion2-tracker/" target="_blank" rel="noopener">Website</a></span>
  </footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const GRADE = { Unique: 'var(--best)', Legend: '#eb6834', Legendary: '#eb6834', Epic: '#9085e9', Rare: '#3987e5' };
let DATA = { members: {} }, LIST = [];
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

function gain(h) {
  // change versus the newest snapshot at least 7 days old, else the oldest we have
  if (!h || h.length < 2) return 0;
  const last = h[h.length - 1], cutoff = new Date(Date.parse(last.date) - 7 * 864e5).toISOString().slice(0, 10);
  const base = [...h].reverse().find(x => x.date <= cutoff) || h[0];
  return last.cp - base.cp;
}

/* line chart: series [{name, color, points:[{date, v}]}], one y axis, crosshair tooltip. Drawn after the page is in
   place so the chart is measured at its real width and its text stays the same size at any window size */
const CHARTS = {};
function lineChart(series, opts = {}) {
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  CHARTS[id] = [series, opts];
  return `<div class="chart" id="${id}"></div>` + (series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="sw" style="--c:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '');
}
function drawCharts() {
  for (const [id, [series, { unit = 'CP', height = 280 }]] of Object.entries(CHARTS)) {
    const box = document.getElementById(id); delete CHARTS[id]; if (!box) continue;
    const dates = [...new Set(series.flatMap(s => s.points.map(p => p.date)))].sort();
    if (dates.length < 2) { box.innerHTML = '<p class="hint">The trend shows up after the second daily update.</p>'; continue; }
    const W = Math.max(280, box.clientWidth), H = height, L = 48, R = series.length > 1 ? 100 : 16, T = 12, B = 28;
    const vals = series.flatMap(s => s.points.map(p => p.v));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo || hi || 1) * 0.08; lo = Math.max(0, lo - pad); hi += pad;
    const x = d => L + dates.indexOf(d) / (dates.length - 1) * (W - L - R);
    const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const ticks = [0, 1, 2, 3].map(i => lo + (hi - lo) * i / 3);
    const n = Math.max(2, Math.min(6, Math.floor((W - L - R) / 90)));
    const xt = dates.length <= n ? dates : [...Array(n).keys()].map(i => dates[Math.round(i * (dates.length - 1) / (n - 1))]);
    const short = d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const lines = series.map(s => {
      const pts = s.points.map(p => `${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
      const last = s.points[s.points.length - 1];
      const label = series.length > 1 && series.length <= 4 ? `<text class="lbl" x="${x(last.date) + 8}" y="${y(last.v) + 4}">${esc(s.name)}</text>` : '';
      return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${x(last.date)}" cy="${y(last.v)}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>${label}`;
    }).join('');
    box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} over time">
        <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
        <g class="axis">${ticks.map(t => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t >= 1e4 && hi - lo > 4e3 ? Math.round(t / 1e3) + 'k' : fmt(Math.round(t))}</text>`).join('')}
          ${xt.map(d => `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${short(d)}</text>`).join('')}</g>
        <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
        ${lines}
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
      </svg><div class="tipbox" hidden></div>`;
    wireChart(id, series, dates, x, W, short, unit);
  }
}
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(route, 150); });

function wireChart(id, series, dates, x, W, short, unit) {
  const box = document.getElementById(id); if (!box) return;
  const svg = box.querySelector('svg'), cross = svg.querySelector('.cross'), tip = box.querySelector('.tipbox');
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const d = dates.reduce((a, b) => Math.abs(x(b) - px) < Math.abs(x(a) - px) ? b : a);
    cross.setAttribute('x1', x(d)); cross.setAttribute('x2', x(d)); cross.setAttribute('visibility', 'visible');
    const rows = series.map(s => [s, s.points.find(p => p.date === d)]).filter(([, p]) => p).sort((a, b) => b[1].v - a[1].v);
    tip.innerHTML = `<div class="d">${short(d)}</div>` + rows.map(([s, p]) => `<div><i class="sw" style="--c:${s.color}"></i>${esc(s.name)} <b>${fmt(p.v)}</b> ${unit}</div>`).join('');
    tip.hidden = false;
    const left = x(d) / W * r.width;
    tip.style.left = (left > r.width / 2 ? left - tip.offsetWidth - 12 : left + 12) + 'px'; tip.style.top = '8px';
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
}

const head = (eyebrow, title, right = '') => `<header class="head"><div><p class="eyebrow">${eyebrow}</p><h1 class="title">${title}</h1></div>${right}</header>`;
const memberLink = n => '#/member/' + encodeURIComponent(n);

function dashboard() {
  if (!LIST.length) return head('Overview', 'Your group') + `<div class="panel empty">No data yet. ${inApp() ? 'Add your characters in Settings, then Refresh.' : 'The first daily update hasn’t run yet.'}</div>`;
  const avg = Math.round(LIST.reduce((a, m) => a + m.cp, 0) / LIST.length);
  const top = LIST[0], best = [...LIST].sort((a, b) => b.gain - a.gain)[0];
  const tile = (k, v, s) => `<div class="tile"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
  return head('Overview', 'Your group') + `
    <div class="tiles">
      ${tile('Members', LIST.length, 'tracked characters')}
      ${tile('Average CP', fmt(avg), 'combat power across the group')}
      ${tile('Strongest', fmt(top.cp), esc(top.name))}

const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const bar = (label, n, d, sub = '') => `<div class="mrow"><div class="mhead"><span>${label}</span><span class="num">${fmt(n)} / ${fmt(d)}</span></div>
  <span class="meter"><i style="width:${pct(n, d)}%"></i></span>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
const iconCard = (icon, name, sub, right = '', g) => `<div class="item" style="--g:${GRADE[g] || 'var(--line)'}">

const daevTotals = m => (m.daevanion?.boardList || []).reduce((a, b) => [a[0] + b.openNodeCount, a[1] + b.totalNodeCount], [0, 0]);

// Build priorities from community guides (mobalytics.gg, gamesfuze.com, keengamer.com), as [skill, target level].
// ponytail: targets the guides don't state are our estimate; tweak here as the meta moves.
// The class comes from the first two digits of the skill ids.
// stats: Daevanion stat nodes worth a detour, best first (big nodes before the small ones they share a list with).
const DPS = ['Combat Speed', 'Cooldown Reduction', 'Damage Boost', 'Critical Damage Boost', 'Multi-Hit Chance', 'Attack', 'Critical Hit'];
const BUILDS = {
  11: { cls: 'Gladiator',
    active: [['Overhead Slam', 16], ['Rending Blow', 16], ['Sword Aura Rampage', 16], ['Mocking Blade', 8], ['Ruinous Blow', 12], ['Keen Strike', 12], ['Leaping Slam', 12]],
    passive: ['Attack Preparation', 'Experienced Counterstrike', 'Impact Hit', 'Murderous Burst'],
    stigma: [['Lunge Stance', 20], ['Zikel\'s Blessing', 10], ['Rage Burst', 5], ['Zikel\'s Blessing', 15], ['Rage Burst', 20]],
    stats: DPS },
  12: { cls: 'Templar',
    active: [['Pummel', 16], ['Vicious Strike', 16], ['Warding Strike', 16], ['Poach', 12], ['Punishment', 12], ['Judgment', 12], ['Shield Smite', 12], ['Shield Rush', 12], ['Annihilate', 12], ['Flash Rampage', 8]],
    passive: ['Punishing Benediction', 'Ironclad Defense', 'Enhance Health', 'Warding Shield', 'Fury', 'Insulting Roar'],
    stigma: [['Noble Armor', 10], ['Executing Blade', 10], ['Doom Shield', 10], ['Battlefield Banner', 10]],

  13: { cls: 'Assassin',

    passive: ['Exploit Weakness', 'Rear Smite', 'Assault Stance', 'Impact Hit', 'Apply Poison'],
    stigma: [['Savage Fang', 10], ['Triniel\'s Dagger', 10], ['Illusive Clone', 10], ['Swift Contract', 10]],
    stats: ['Critical Damage Boost', 'Combat Speed', 'Cooldown Reduction', 'Damage Boost', 'Multi-Hit Chance', 'Critical Hit', 'Attack'] },
  14: { cls: 'Ranger',
    active: [['Deadshot', 16], ['Gale Arrow', 16], ['Drill Dart', 16], ['Snipe', 12], ['Marking Shot', 12], ['Burst Arrow', 12], ['Snare Shot', 12]],
    passive: ['Focused Eye', 'Hunter\'s Resolve', 'Hunter\'s Soul', 'Rooting Eye', 'Concentrated Fire'],
    stigma: [['Vaizel\'s Authority', 10], ['Bow of Blessing', 10], ['Supporting Fire', 10], ['Griffon Arrow', 10]],
    stats: DPS },
  15: { cls: 'Sorcerer',
    active: [['Hellfire', 16], ['Firestorm', 16], ['Blaze', 16], ['Flame Arrow', 12], ['Wish of Concentration', 12], ['Bittercold Wind', 12], ['Ice Chain', 12]],
    passive: ['Grace of Enhancement', 'Robe of Flame', 'Fire Mark', 'Robe of Earth'],
    stigma: [['Element Enhancement', 10], ['Delayed Explosion', 10], ['Fire Wall', 10], ['Cold Storm', 10]],
    stats: ['Cooldown Reduction', 'Combat Speed', 'Critical Damage Boost', 'Damage Boost', 'Multi-Hit Chance', 'Attack', 'Critical Hit'] },
  16: { cls: 'Spiritmaster',
    active: [['Elemental Fusion', 16], ['Jointstrike: Curse', 16], ['Combustion', 16], ['Dimensional Control', 12], ['Summon: Fire Spirit', 12]],
    passive: ['Spirit Strike', 'Spirit\'s Descent', 'Consecutive Countercurrent', 'Element Unification'],
    stigma: [['Summon: Ancient Spirit', 10], ['Flame Blessing', 10], ['Jointstrike: Destructive Attack', 10], ['Jointstrike: Corrode', 10]],
    stats: DPS },
  17: { cls: 'Cleric',
    active: [['Healing Light', 16], ['Radiant Recovery', 16], ['Light of Regeneration', 16], ['Chain of Torment', 12], ['Condemnation', 12], ['Judgment Thunder', 12], ['Bolt', 12]],
    passive: ['Healing Enhancement', 'Empyrean Lord\'s Grace', 'Earth\'s Grace', 'Warm Benediction', 'Radiant Benediction'],
    stigma: [['Earth Punishment', 10], ['Light of Protection', 10], ['Noble Aura', 10], ['Summon Resurrection', 10]],
    stats: ['Combat Speed', 'Cooldown Reduction', 'Damage Tolerance', 'Damage Boost', 'Attack', 'Max HP', 'Defense'] },
  18: { cls: 'Chanter',
    active: [['Dark Crush', 16], ['Spinning Strike', 16], ['Impactful Crush', 16], ['Incandescent Blow', 12], ['Onslaught', 12], ['Heat Wave Blow', 12]],
    passive: ['Attack Preparation', 'Earth\'s Promise', 'Impact Hit', 'Inspiring Spell'],
    stigma: [['Undefeated Mantra', 10], ['Power of the Storm', 10], ['Marchutan\'s Wrath', 10], ['Fracturing Blow', 10]],
    stats: ['Combat Speed', 'Damage Boost', 'Cooldown Reduction', 'Critical Damage Boost', 'Multi-Hit Chance', 'Attack', 'Critical Hit'] },
};
// Ariel (PvE) and Azphel (PvP) have their own stats, the same for every class
const SIDE_BOARDS = {
  Ariel: ['PvE Damage Boost', 'Boss Damage Boost', 'Critical Hit', 'PvE Attack, PvE Defense', 'Boss Attack, Boss Defense', 'PvE Attack', 'Boss Attack', 'PvE Accuracy'],
  Azphel: ['PvP Damage Boost', 'PvP Damage Tolerance', 'Status Effect Chance', 'PvP Attack, PvP Defense', 'PvP Critical Hit, PvP Critical Hit Resist', 'PvP Attack', 'PvP Critical Hit', 'PvP Accuracy'],
};

function advice(m) {
  const list = m.skill?.skillList || [], b = BUILDS[Math.floor((list[0]?.id || 0) / 1e6)];
  if (!b) return [];
  const byName = n => list.find(x => x.name === n) || { name: n, skillLevel: 0 };
  const picks = [];
  const act = b.active.map(([n, t]) => [byName(n), t]).filter(([s, t]) => s.skillLevel < t).slice(0, 2);
  act.forEach(([s, t]) => picks.push([s, `Skill point: Lv ${s.skillLevel} → ${t}`, 'Rotation skill, next specialty breakpoint']));
  // guides say keep passives even, so the lowest priority passive goes next
  const pas = b.passive.map(byName).reduce((a, s) => s.skillLevel < a.skillLevel ? s : a);
  picks.push([pas, `Skill point: Lv ${pas.skillLevel} → ${pas.skillLevel + 1}`, 'Lowest of your key passives']);
  const st = b.stigma.map(([n, t]) => [byName(n), t]).find(([s, t]) => !s.acquired || !s.equip || s.skillLevel < t);
  if (st) { const [s, t] = st; picks.push([s, !s.acquired ? 'Get this stigma' : !s.equip ? 'Equip this stigma' : `Stigma: Lv ${s.skillLevel} → ${t}`, 'Core stigma for the build']); }
  return [b, picks];
}

// ponytail: crystal cost per node grade from GameWith's planner (Common 1, Rare 2, Epic 3, Unique 4); Legend taken as Epic.
const COST = { Common: 1, Rare: 2, Legend: 3, Unique: 4 };
// These four share the normal Daevanion points; every other board has its own crystals.
const NORMAL = ['Nezekan', 'Zikel', 'Vaizel', 'Triniel'];

// The best closed node on each board to head for, with the cheapest path to it from what's already open.
// Nodes link up, down, left and right. Worth a detour: build skill nodes first, then big stat nodes, then small ones.
function boardPicks(m, b) {
  const skills = [...b.active.map(x => x[0]), ...b.passive];
  const rank = (n, stats) => n.name.startsWith('Skill Level Up - ') ? (skills.includes(n.name.slice(17)) ? [0, skills.indexOf(n.name.slice(17))] : null)
    : stats.includes(n.name) ? [n.grade === 'Common' ? 2 : 1, stats.indexOf(n.name)] : null;
  const picks = {}, boards = [];
  for (const [id, rows] of Object.entries(m.boards || {})) {
    const board = (m.daevanion?.boardList || []).find(x => x.id == id) || {};
    const nodes = rows.map(r => { const [row, col, grade, open, ...name] = r.split('|'); return { row: +row, col: +col, grade, open: open === '1', name: name.join('|') }; });
    const at = new Map(nodes.map(n => [n.row + ',' + n.col, n]));
    const q = nodes.filter(n => n.open);
    q.forEach(n => n.cost = 0);
    while (q.length) {  // Dijkstra; a board has at most a few hundred nodes, so a sorted array is fine
      q.sort((x, y) => x.cost - y.cost);
      const n = q.shift();
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const o = at.get((n.row + dr) + ',' + (n.col + dc));
        if (o && !o.open && n.cost + COST[o.grade] < (o.cost ?? Infinity)) { o.cost = n.cost + COST[o.grade]; o.prev = n; q.push(o); }
      }
    }
    boards.push({ board, nodes });
    const stats = SIDE_BOARDS[board.name] || b.stats;
    const key = NORMAL.includes(board.name) ? 'Daevanion points' : board.name + ' crystals';
    for (const n of nodes) {
      const r = !n.open && n.cost !== undefined && rank(n, stats);
      if (!r) continue;
      const score = [r[0], n.cost, r[1]], best = picks[key];
      if (best && best.score.reduce((d, v, i) => d || v - score[i], 0) <= 0) continue;
      let first = n, steps = 1;
      while (!first.prev.open) { first = first.prev; steps++; }
      picks[key] = { key, board, node: n, first, steps, score };
    }
  }
  for (const p of Object.values(picks)) {  // mark each pick's path so the board grid can light it up
    for (let n = p.node; !n.open; n = n.prev) n.path = true;
    p.node.goal = true;
    boards.find(x => x.board === p.board).pick = p;
  }
  return { picks: Object.values(picks), boards };
}

// A Daevanion board as the game draws it: open nodes lit, the suggested path outlined, the goal ringed.
const boardGrid = ({ board, nodes, pick }) => {
  const r0 = Math.min(...nodes.map(n => n.row)), c0 = Math.min(...nodes.map(n => n.col));
  const cols = Math.max(...nodes.map(n => n.col)) - c0 + 1;
  return `<figure class="dboard"><figcaption><img src="${esc(board.icon)}" alt="">${esc(board.name)} <span class="hint">${fmt(board.openNodeCount)} / ${fmt(board.totalNodeCount)}</span></figcaption>
    <div class="dgrid" style="--cols:${cols}">${nodes.map(n => `<i class="${n.grade === 'Start' ? 'start' : ''}${n.open ? ' on' : ''}${n.path ? ' path' : ''}${n.goal ? ' goal' : ''}${n.name.startsWith('Skill Level Up') ? ' skill' : ''}"
      style="grid-area:${n.row - r0 + 1}/${n.col - c0 + 1};--g:${GRADE[n.grade] || 'var(--muted)'}" title="${esc(n.name)}${n.goal ? ' (goal)' : n.path ? ' (on the way)' : n.open ? ' (open)' : ''}"></i>`).join('')}</div>
    ${pick ? `<p class="sub">Goal: <b>${esc(pick.node.name)}</b>, ${pick.node.cost} pts${pick.steps > 1 ? `, open ${esc(pick.first.name)} first` : ''}</p>` : ''}</figure>`;
};
const BOARD_KEY = `<p class="legend"><span><i class="dk on"></i>Open</span><span><i class="dk path"></i>Open next</span><span><i class="dk goal"></i>Goal</span><span><i class="dk skill"></i>Skill node</span><span><i class="dk"></i>Closed</span></p>`;

// The build's skills as one table: level now, the goal, and which ones get the next points.
function skillTable(m, b, picks) {
  const list = m.skill?.skillList || [], byName = n => list.find(x => x.name === n) || { name: n, skillLevel: 0 };
  const next = new Map(picks.map(([s, what]) => [s.name, what]));
  const top = Math.max(...b.passive.map(n => byName(n).skillLevel));  // guides say keep passives even
  const rows = [...b.active.map(([n, t]) => [byName(n), t, 'Active']), ...b.passive.map(n => [byName(n), top, 'Passive']),
    ...b.stigma.filter(([n], i, a) => a.findIndex(x => x[0] === n) === i).map(([n]) => [byName(n), Math.max(...b.stigma.filter(x => x[0] === n).map(x => x[1])), 'Stigma'])];
  return `<table class="cmp skills"><tr><th></th><th>Skill</th><th>Type</th><th class="n">Now</th><th class="n">Goal</th><th>Progress</th></tr>
    ${rows.map(([s, t, type]) => `<tr class="${next.has(s.name) ? 'next' : ''}"><td><img src="${esc(s.icon || '')}" alt=""></td>
      <td>${esc(s.name)}${next.has(s.name) ? `<div class="sub">Next: ${esc(next.get(s.name))}</div>` : ''}</td><td class="sub">${type}</td>
      <td class="n">${s.skillLevel}</td><td class="n">${t}</td>
      <td><div class="meter${s.skillLevel >= t ? '' : ' no'}"><i style="width:${Math.min(100, pct(s.skillLevel, t))}%"></i></div></td></tr>`).join('')}</table>`;
}

function nextUpgrade(m) {
  const [b, picks] = advice(m);
  if (!b) return '<section class="panel"><h2 class="ph">Next upgrade</h2><p class="hint">No build guide for this class yet.</p></section>';
  const { boards } = boardPicks(m, b), shown = boards.filter(x => x.pick);
  return `<section class="panel wrap"><h2 class="ph">Skill points <span class="hint">${b.cls} build · highlighted rows get the next points</span></h2>${skillTable(m, b, picks)}</section>
    <section class="panel"><h2 class="ph">Daevanion points go here</h2>
      ${shown.length ? `<div class="dboards">${shown.map(boardGrid).join('')}</div>${BOARD_KEY}` : `<p class="hint">${m.boards ? 'Nothing left on the build path.' : 'The boards arrive with the next daily update.'}</p>`}
      <p class="hint">The four main boards share your Daevanion points; Ariel and Azphel use their own crystals. Counted from what was open at the last update. Refunds cost 500 Kina a node.</p></section>`;
}

function memberOverview(m) {
  const pw = m.petwing || {}, t = m.title || {}, [dn, dt] = daevTotals(m);
  return nextUpgrade(m) + `<section class="panel"><h2 class="ph">Combat power over time</h2>${lineChart([{ name: m.name, color: m.color, points: m.history.map(h => ({ date: h.date, v: h.cp })) }])}</section>
    <div class="grid3">
      <section class="panel"><h2 class="ph">Wings and pet</h2><div class="gear one">
        ${pw.wing ? iconCard(pw.wing.icon, pw.wing.name, `Wings · <span class="grade">${esc(pw.wing.grade)}</span>`, '+' + pw.wing.enchantLevel, pw.wing.grade) : '<p class="hint">No wings.</p>'}
        ${pw.pet ? iconCard(pw.pet.icon, pw.pet.name, 'Pet', 'Lv ' + pw.pet.level) : '<p class="hint">No pet.</p>'}</div></section>
      <section class="panel"><h2 class="ph">Titles</h2>${t.totalCount ? bar('Collected', t.ownedCount, t.totalCount) : ''}
        <div class="list">${(t.titleList || []).map(x => `<div><div class="name">${esc(x.name)} <span class="grade" style="--g:${GRADE[x.grade] || 'var(--muted)'}">${esc(x.grade)}</span></div>
          <div class="sub">${esc(x.equipCategory)} · ${(x.equipStatList || []).map(e => esc(e.desc)).join(' · ')}</div></div>`).join('')}</div></section>
      <section class="panel"><h2 class="ph">Daevanion</h2>${dt ? bar('Nodes opened', dn, dt) : '<p class="hint">No data.</p>'}
        <a href="#/member/${encodeURIComponent(m.name)}/stats">See every board</a></section>
    </div>`;
}

function memberSkills(m) {
  const list = m.skill?.skillList || [];
  const group = (title, xs) => xs.length ? `<section class="panel wrap"><h2 class="ph">${title} <span class="hint">${xs.length}</span></h2>
    <table class="cmp skills"><tr><th></th><th>Skill</th><th>Type</th><th class="n">Level</th></tr>${xs.map(x => `<tr><td><img src="${esc(x.icon)}" alt=""></td><td>${esc(x.name)}</td>
      <td class="sub">${x.acquired ? (x.category === 'Dp' ? 'DP skill' : esc(x.category)) : `Unlocks at Lv ${x.needLevel}`}</td><td class="n">${x.skillLevel}</td></tr>`).join('')}</table></section>` : '';
  const used = x => x.equip && x.acquired;
  return group('Equipped active skills', list.filter(x => x.category === 'Active' && used(x)))
    + group('Equipped DP skills', list.filter(x => x.category === 'Dp' && used(x)))
    + group('Passive skills', list.filter(x => x.category === 'Passive' && x.acquired))
    + group('Learned, not equipped', list.filter(x => x.category !== 'Passive' && x.acquired && !x.equip))
    + group('Not learned yet', list.filter(x => !x.acquired))
    || '<div class="panel empty">No skill data yet. It arrives with the next daily update.</div>';
}

function memberStats(m) {
  const stats = (m.stats || []).filter(x => x.type !== 'ItemLevel');
  const base = stats.filter(x => /^[A-Z]{3}$/.test(x.type)), god = stats.filter(x => !/^[A-Z]{3}$/.test(x.type));
  const table = xs => `<table class="cmp">${xs.map(x => `<tr><td>${esc(x.name)}</td><td class="n">${fmt(x.value)}</td><td class="sub">${(x.statSecondList || []).map(esc).join(' · ')}</td></tr>`).join('')}</table>`;
  const boards = m.daevanion?.boardList || [], b = BUILDS[Math.floor((m.skill?.skillList?.[0]?.id || 0) / 1e6)];
  const grids = m.boards && b ? boardPicks(m, b).boards : null;
  return `<section class="panel"><h2 class="ph">Daevanion boards</h2>
      ${grids ? `<div class="dboards">${grids.map(boardGrid).join('')}</div>${BOARD_KEY}`
        : boards.map(b => `<div class="board"><img src="${esc(b.icon)}" alt="" loading="lazy">${bar(esc(b.name), b.openNodeCount, b.totalNodeCount)}</div>`).join('') || '<p class="hint">No data.</p>'}</section>
    <section class="panel wrap"><h2 class="ph">Base stats</h2>${table(base)}</section>
    <section class="panel wrap"><h2 class="ph">Deity stats</h2>${table(god)}</section>`;
}

function member(name, tab) {
  const m = LIST.find(x => x.name === name);
  if (!m) return head('Member', 'Not found') + `<div class="panel empty"><a href="#/members">Back to members</a></div>`;
  const rank = LIST.indexOf(m) + 1, [dn, dt] = daevTotals(m), base = '#/member/' + encodeURIComponent(m.name);
  const tile = (k, v, s) => `<div class="tile"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
  const tabs = [['', 'Overview'], ['gear', 'Gear'], ['skills', 'Skills'], ['stats', 'Stats and Daevanion']];
  return head(`${esc(m.server)} · Level ${m.level}`, esc(m.name), `<a class="btn" href="#/compare?a=${encodeURIComponent(m.name)}">Compare</a>`) + `
    <div class="tiles">
      ${tile('Combat power', fmt(m.cp), `#${rank} in the group`)}
      ${tile('Item level', fmt(m.il), 'from equipped gear')}
      ${tile('Last 7 days', `<span class="${m.gain > 0 ? 'up' : m.gain < 0 ? 'down' : ''}">${signed(m.gain)}</span>`, 'combat power')}
      ${tile('Daevanion', dt ? pct(dn, dt) + '%' : '–', dt ? `${fmt(dn)} of ${fmt(dt)} nodes` : 'no data yet')}
    </div>
    <nav class="tabs">${tabs.map(([k, l]) => `<a href="${base}${k ? '/' + k : ''}" ${k === (tab || '') ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>
    ${tab === 'gear' ? `<section class="panel"><h2 class="ph">Equipment</h2>${gearGrid(m.gear)}</section>`
      : tab === 'skills' ? memberSkills(m) : tab === 'stats' ? memberStats(m) : memberOverview(m)}`;
}

function raid() {
  const need = +store.get('raidIL', 0) || 0;
  const ready = LIST.filter(m => m.il >= need).length;
  return head('Before the run', 'Raid check') + `
    <section class="panel">
      <label class="ph" for="need">Required item level</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input id="need" type="number" min="0" step="10" value="${need || ''}" placeholder="e.g. 1800" style="width:10em">
        <span class="hint">${need ? `${ready} of ${LIST.length} ready` : 'Type the item level the run needs.'}</span></div>
    </section>
    <section class="panel"><ol class="rows">${[...LIST].sort((a, b) => b.il - a.il).map(m => {
      const ok = !need || m.il >= need, pct = need ? Math.min(100, m.il / need * 100) : 100;
      return `<li><a class="row" href="${memberLink(m.name)}" style="--c:${m.color};grid-template-columns:minmax(0,1fr) minmax(90px,200px) auto">
        <span><div class="name">${esc(m.name)}</div><div class="sub">IL ${fmt(m.il)}${need && !ok ? ` · needs ${fmt(need - m.il)} more` : ''}</div></span>
        <span class="meter ${ok ? '' : 'no'}"><i style="width:${pct}%"></i></span>
        <span class="status ${ok ? 'ok' : 'no'}">${ok ? '✓ Ready' : '✕ Not yet'}</span></a></li>`;
    }).join('')}</ol></section>`;
}

function compare(params) {
  const names = LIST.map(m => m.name);
  const a = LIST.find(m => m.name === params.get('a')) || LIST[0], b = LIST.find(m => m.name === params.get('b')) || LIST.find(m => m !== a) || a;
  if (!a) return head('Side by side', 'Compare') + '<div class="panel empty">No members yet.</div>';
  const pick = (id, sel) => `<select id="${id}">${names.map(n => `<option ${n === sel.name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  const diff = (x, y) => { const d = x - y; return d ? `<span class="${d > 0 ? 'up' : 'down'}">${signed(d)}</span>` : '='; };
  const slots = [...new Set([...(a.gear || []), ...(b.gear || [])].map(g => g.slotPosName))];
  const at = (m, s) => (m.gear || []).find(g => g.slotPosName === s);
  return head('Side by side', 'Compare', `<div style="display:flex;gap:10px;flex-wrap:wrap">${pick('ca', a)}${pick('cb', b)}</div>`) + `
    <section class="panel wrap"><table class="cmp">
      <tr><th></th><th>${esc(a.name)}</th><th>${esc(b.name)}</th><th class="n">Difference</th></tr>
      <tr><td>Level</td><td>${a.level}</td><td>${b.level}</td><td class="n">${diff(a.level, b.level)}</td></tr>
      <tr><td>Combat power</td><td>${fmt(a.cp)}</td><td>${fmt(b.cp)}</td><td class="n">${diff(a.cp, b.cp)}</td></tr>
      <tr><td>Item level</td><td>${fmt(a.il)}</td><td>${fmt(b.il)}</td><td class="n">${diff(a.il, b.il)}</td></tr>
      <tr><td>Last 7 days</td><td>${signed(a.gain)}</td><td>${signed(b.gain)}</td><td class="n"></td></tr>
      <tr><td>Daevanion nodes</td><td>${fmt(daevTotals(a)[0])}</td><td>${fmt(daevTotals(b)[0])}</td><td class="n">${diff(daevTotals(a)[0], daevTotals(b)[0])}</td></tr>
      <tr><td>Titles collected</td><td>${fmt(a.title?.ownedCount)}</td><td>${fmt(b.title?.ownedCount)}</td><td class="n">${a.title && b.title ? diff(a.title.ownedCount, b.title.ownedCount) : ''}</td></tr>
      <tr><td>Wings</td><td>${esc(a.petwing?.wing?.name ?? '–')}</td><td>${esc(b.petwing?.wing?.name ?? '–')}</td><td class="n"></td></tr>
    </table></section>
    <section class="panel wrap"><h2 class="ph">Gear by slot</h2><table class="cmp">
      <tr><th>Slot</th><th>${esc(a.name)}</th><th>${esc(b.name)}</th><th class="n">Enchant</th></tr>
      ${slots.map(s => { const x = at(a, s), y = at(b, s); return `<tr><td class="sub">${esc(s)}</td>
        <td>${x ? `${esc(x.name)} <b>+${x.enchantLevel}</b>` : '–'}</td><td>${y ? `${esc(y.name)} <b>+${y.enchantLevel}</b>` : '–'}</td>
        <td class="n">${x && y ? diff(x.enchantLevel, y.enchantLevel) : ''}</td></tr>`; }).join('')}
    </table></section>`;
}

const inApp = () => !!window.pywebview;
async function showTracked() {
  const rows = await pywebview.api.members();
  $('#tracked').innerHTML = rows.map(([n, srv]) => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto">
    <span><div class="name">${esc(n)}</div><div class="sub">${esc(srv)}</div></span><button class="btn small" data-n="${esc(n)}">Remove</button></div>`).join('') || '<p class="hint">None yet. Search above to add one.</p>';
  $('#tracked').querySelectorAll('button').forEach(b => b.onclick = () => { b.disabled = true; pywebview.api.remove(b.dataset.n); });
}
function settings() {
  return head('App', 'Settings') + (inApp() ? `
    <section class="panel"><h2 class="ph">Update</h2><p class="hint">The app fetches fresh stats each time it opens. Fetch again now:</p>
      <div><button class="btn primary" id="refresh">Refresh now</button></div></section>
    <section class="panel"><h2 class="ph">Add a character</h2>
      <form id="findForm" style="display:flex;gap:10px;flex-wrap:wrap"><input id="findName" placeholder="Character name" autocomplete="off" style="flex:1;min-width:12em"><button class="btn primary">Search</button></form>
      <div id="found" class="rows"></div></section>
    <section class="panel"><h2 class="ph">Tracked characters</h2><div id="tracked" class="rows"><p class="hint">Loading…</p></div>
      <div><button class="btn" id="editMembers">Edit the list as a file</button></div></section>` : `
    <section class="panel"><h2 class="ph">Members</h2><p class="hint">The website updates once a day. To add friends, edit <code>members.txt</code> in the GitHub repo.</p>
      <div><a class="btn" href="https://github.com/Rayn16/aion2-tracker/edit/main/members.txt" target="_blank" rel="noopener">Edit members on GitHub</a></div></section>
    <section class="panel"><h2 class="ph">Windows app</h2><p class="hint">Updates whenever you open it, in its own window.</p>
      <div><a class="btn primary" href="https://github.com/Rayn16/aion2-tracker/releases/latest/download/Aion2Tracker.exe">Download for Windows</a></div></section>`) + `
    <section class="panel"><h2 class="ph">About</h2><p class="hint">Stats come from the official AION 2 character pages (Europe). Not affiliated with NCSOFT.</p></section>`;
}

function route() {
  const [path, query] = location.hash.slice(2).split('?');
  const [page, arg, sub] = path.split('/');
  const params = new URLSearchParams(query);
  const cur = page === 'member' ? 'members' : page || '';
  document.querySelectorAll('.nav').forEach(a => a.dataset.r === cur ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const v = $('#view');
  v.innerHTML = page === 'members' ? members() : page === 'member' ? member(decodeURIComponent(arg || ''), sub) : page === 'raid' ? raid()
    : page === 'compare' ? compare(params) : page === 'settings' ? settings() : dashboard();
  drawCharts();
  $('main').scrollTop = 0;
  $('#need')?.addEventListener('input', e => { store.set('raidIL', e.target.value); const pos = e.target.selectionStart; route(); const n = $('#need'); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} });
  const go = () => location.hash = `#/compare?a=${encodeURIComponent($('#ca').value)}&b=${encodeURIComponent($('#cb').value)}`;
  $('#ca')?.addEventListener('change', go); $('#cb')?.addEventListener('change', go);
  $('#refresh')?.addEventListener('click', e => { e.target.disabled = true; e.target.textContent = 'Updating…'; pywebview.api.refresh(); });
  $('#editMembers')?.addEventListener('click', () => pywebview.api.edit_members());
  if ($('#tracked')) showTracked();
  $('#findForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const box = $('#found'); box.innerHTML = '<p class="hint">Searching…</p>';
    try {
      const hits = await pywebview.api.search($('#findName').value);
      box.innerHTML = hits.length ? hits.map((c, i) => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto">
        <span><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.server)} · Level ${c.level}</div></span>
        <button class="btn small" data-i="${i}">Add</button></div>`).join('') : '<p class="hint">No characters with that name in Europe.</p>';
      box.querySelectorAll('button').forEach(b => b.onclick = () => { const c = hits[b.dataset.i]; b.disabled = true; b.textContent = 'Adding…'; pywebview.api.add(c.name, c.server); });
    } catch { box.innerHTML = '<p class="hint">Search failed. Check your internet connection.</p>'; }
  });
}

function load(data) {
  DATA = data;
  const order = Object.keys(data.members); // colour follows the member, never their rank
  LIST = Object.entries(data.members).map(([name, m]) => ({ name, ...m, gain: gain(m.history), color: `var(--s${order.indexOf(name) % 8 + 1})` }))
    .sort((a, b) => b.cp - a.cp);
  $('#barUpdated').innerHTML = data.updated ? `Updated <b>${esc(data.updated)}</b>` : 'Not updated yet';
  $('#barCount').innerHTML = `<b>${LIST.length}</b> members`;
  route();
}

addEventListener('hashchange', route);
addEventListener('pywebviewready', route);
fetch('data.json', { cache: 'no-store' }).then(r => r.json()).then(load).catch(() => load({ members: {} }));
</script>
</body>
</html>
